                            </svg>
                        </button>
                    </div>
                    <div id="tag-filter-container" class="tag-filter-container"></div>
                </div>
                <div class="filter-group">
                    <label>옵션</label>
                    <div class="toggle-group" style="margin-top: 0;">
                        <label class="toggle-switch" for="hideExpansionsToggle">
                            <input type="checkbox" id="hideExpansionsToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                        <label for="hideExpansionsToggle" class="toggle-label">확장 숨김</label>
                    </div>
                </div>
                <div class="filter-group">
                    <label>난이도:</label>

    <!-- Firebase SDK (boardlifeGames 마스터 DB 고속 조회용) -->

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        /* =========================================================
           1. 원본 firebase-config.js & search-keywords.js 내장
           ========================================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyCr3bsfOssOHnD1ART57EqpK9eaiA93ick",
            authDomain: "mybgshelf.firebaseapp.com",
            projectId: "mybgshelf",
            storageBucket: "mybgshelf.firebasestorage.app",
            messagingSenderId: "435059169096",
            appId: "1:435059169096:web:9d2db5ef9358bd2ff9c57d",
            measurementId: "G-7E5G4EY6XB",
            apiBaseUrl: "https://mybgshelf.web.app"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 원본 /lib/search-keywords.js (자모 분해 및 초성 검색 엔진)
        (function (global) {
            const HANGUL_BASE = 0xAC00, HANGUL_END = 0xD7A3, MAX_INDEXED_KEY_LENGTH = 12;
            const CHOSUNG_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const CHOSUNG_SET = new Set(CHOSUNG_LIST);
            const JUNGSUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
            const JONGSUNG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const COMPOUND_JONG = {'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
            const COMPOUND_JUNG = {'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};

            function decomposeHangul(str) {
                let out = '';
                for (const ch of (str || '')) {
                    const code = ch.charCodeAt(0);
                    if (code >= HANGUL_BASE && code <= HANGUL_END) {
                        const idx = code - HANGUL_BASE;
                        const cho = CHOSUNG_LIST[Math.floor(idx / 588)];
                        const jungRaw = JUNGSUNG_LIST[Math.floor((idx % 588) / 28)];
                        const jongRaw = JONGSUNG_LIST[idx % 28];
                        const jung = COMPOUND_JUNG[jungRaw] || jungRaw;
                        const jong = jongRaw ? (COMPOUND_JONG[jongRaw] || jongRaw) : '';
                        out += cho + jung + jong;
                    } else {
                        out += COMPOUND_JONG[ch] || COMPOUND_JUNG[ch] || ch;
                    }
                }
                return out;
            }
            function normalizeQuery(input) { return (input == null ? '' : String(input)).replace(/\s+/g, '').toLowerCase(); }
            function isAllChosung(s) { if (!s) return false; for (const ch of s) { if (!CHOSUNG_SET.has(ch)) return false; } return true; }
            function buildSearchKey(input) {
                const q = normalizeQuery(input);
                if (q.length === 0) return { key: null, reason: 'empty' };
                const jamo = decomposeHangul(q);
                if (jamo.length < 2) return { key: null, reason: 'too_short' };
                return { key: jamo.slice(0, MAX_INDEXED_KEY_LENGTH), reason: 'ok' };
            }
            function buildExactNameKey(input) { const q = normalizeQuery(input); return q ? '=' + q : ''; }
            global.SearchKeywords = { buildSearchKey, buildExactNameKey, normalizeQuery, isAllChosung, decomposeHangul };
        })(window);

        function normalizeGameRecord(raw) {
            if (!raw) return null;
            const custom = { ...(raw.customFields || {}) };
            // 이전 버전 필드(purchasePrice, purchaseDate, memo)를 원본 customFields 구조와 동기화
            if (raw.purchasePrice && !custom['구매가격']) custom['구매가격'] = String(raw.purchasePrice);
            if (raw.purchaseDate && !custom['구매일자']) custom['구매일자'] = String(raw.purchaseDate);

            const name = raw.name || raw.title || custom['게임 이름'] || '이름 없음';
            const minP = String(raw.minplayers ?? raw.minP ?? '1');
            const maxP = String(raw.maxplayers ?? raw.maxP ?? '4');
            const minT = String(raw.minplaytime ?? raw.time ?? '30');
            const maxT = String(raw.maxplaytime ?? raw.time ?? '60');
            const comp = String(raw.complexity ?? raw.weight ?? '2.5');

            return {
                ...raw,
                id: raw.id || `bl_${Date.now()}`,
                name,
                title: name, // 마이페이지 하위 호환용
                image: raw.image || raw.thumbnail || '',
                thumbnail: raw.thumbnail || raw.image || '',
                minplayers: minP,
                maxplayers: maxP,
                minplaytime: minT,
                maxplaytime: maxT,
                complexity: comp,
                categories: Array.isArray(raw.categories) ? raw.categories : (raw.category ? [raw.category] : []),
                themes: Array.isArray(raw.themes) ? raw.themes : [],
                mechanics: Array.isArray(raw.mechanics) ? raw.mechanics : [],
                bestplayercounts: Array.isArray(raw.bestplayercounts) ? raw.bestplayercounts : [],
                tags: Array.isArray(raw.tags) ? raw.tags : [],
                memo: raw.memo || '',
                memoPublic: raw.memoPublic !== false,
                myRating: raw.myRating ?? raw.rating ?? null,
                plays: Number(raw.plays) || 0,
                purchasePrice: parseInt(String(custom['구매가격'] || raw.purchasePrice || '0').replace(/[^0-9]/g, ''), 10) || 0,
                purchaseDate: normalizeDateStr(custom['구매일자'] || raw.purchaseDate || ''),
                customFields: custom,
                createdAt: raw.createdAt || Date.now()
            };
        }

        function normalizeDateStr(str) {
            if (!str) return '';
            const digits = String(str).replace(/[^0-9]/g, '');
            if (digits.length === 8) {
                return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
            }
            return String(str).trim();
        }

        function getBlNumId(g) {
            if (!g) return null;
            if (g.boardlifeNumId != null && g.boardlifeNumId !== '') return String(g.boardlifeNumId);
            const candidates = [g.boardlifeId, g.bggId, g.boardlifeDbId, g.id];
            for (const c of candidates) {
                if (!c) continue;
                const m = String(c).match(/(?:bl_|boardlife_)?(\d+)/);
                if (m) return m[1];
            }
            return null;
        }

        async function syncToGistSilent() {
            try {
                const cfg = JSON.parse(localStorage.getItem(GIST_CONFIG_KEY) || '{}');
                if (!cfg.token || !cfg.gistId || cfg.autoSync === false) return;
                const payload = {
                    updatedAt: new Date().toISOString(),
                    games: allUserGames,
                    tags: allUserTags,
                    sessions: JSON.parse(localStorage.getItem(SESSIONS_STORAGE_KEY) || '[]'),
                    players: JSON.parse(localStorage.getItem(PLAYERS_STORAGE_KEY) || '[]')
                };
                await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${cfg.token}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(payload, null, 2) } } })
                });
            } catch (e) {}
        }

        async function pullFromGistSilent() {
            try {
                const cfg = JSON.parse(localStorage.getItem(GIST_CONFIG_KEY) || '{}');
                if (!cfg.token || !cfg.gistId || cfg.autoSync === false) return;
                const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
                    headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
                });
                if (!resp.ok) return;
                const data = await resp.json();
                const fileObj = data.files[GIST_FILENAME] || Object.values(data.files)[0];
                if (!fileObj || !fileObj.content) return;
                const parsed = JSON.parse(fileObj.content);
                if (Array.isArray(parsed.games)) {
                    allUserGames = parsed.games.map(normalizeGameRecord);
                    localStorage.setItem(GAMES_STORAGE_KEY, JSON.stringify(allUserGames));
                }
                if (Array.isArray(parsed.tags)) {
                    allUserTags = parsed.tags;
                    localStorage.setItem(TAGS_STORAGE_KEY, JSON.stringify(allUserTags));
                }
                if (Array.isArray(parsed.sessions)) localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(parsed.sessions));
                if (Array.isArray(parsed.players)) localStorage.setItem(PLAYERS_STORAGE_KEY, JSON.stringify(parsed.players));
                renderTagFilters();
                renderFilteredGames();
            } catch (e) {}
        }

        let currentSearchCursor = null;
        let _searchSeq = 0;
        let _lastBoardLifeSearchKey = null;
        let _shownBoardLifeIds = new Set();
        let boardLifeSearchDebounceTimer = null;
        const BOARDLIFE_SEARCH_TIMEOUT_MS = 4000;

        function getBoardLifeSearchSnapshot(query) {
            let timeoutId;
            const timeout = new Promise((_, reject) => {
                timeoutId = setTimeout(() => {
                    const error = new Error('BoardLife search timed out');
                    error.code = 'search-timeout';
                    reject(error);
                }, BOARDLIFE_SEARCH_TIMEOUT_MS);
            });
            return Promise.race([query.get(), timeout]).finally(() => clearTimeout(timeoutId));
        }

        async function getBoardLifeNameMatches(rawInput) {
            const Sk = window.SearchKeywords;
            const trimmed = rawInput.trim();
            if (!trimmed || !Sk || Sk.isAllChosung(Sk.normalizeQuery(trimmed))) return [];
            const queries = [
                db.collection('boardlifeGames').where('searchKeywords', 'array-contains', Sk.buildExactNameKey(trimmed)).limit(5),
                db.collection('boardlifeGames').orderBy('name').startAt(trimmed).endAt(trimmed + '\uf8ff').limit(10),
            ];
            const results = await Promise.all(queries.map(q => getBoardLifeSearchSnapshot(q).then(s => s.docs).catch(() => [])));
            return results.flat();
        }

        function boardLifeMatchRank(name, normQ) {
            const n = (name || '').replace(/\s+/g, '').toLowerCase();
            return n === normQ ? 0 : n.startsWith(normQ) ? 1 : n.includes(normQ) ? 2 : 3;
        }

        // 이름으로 boardlifeGames에서 가장 일치하는 1개 문서를 즉시 찾아 반환 (클릭 시 커버 자동 매칭용)
        async function findBestBoardLifeGameByName(rawTitle) {
            if (!rawTitle) return null;
            // 괄호 부제 제거 (예: "보이드폴 (Voidfall)" -> "보이드폴")
            const cleanName = rawTitle.replace(/\([^)]*\)/g, '').trim() || rawTitle.trim();
            const Sk = window.SearchKeywords;
            const built = Sk.buildSearchKey(cleanName);
            const normQ = Sk.normalizeQuery(cleanName);

            try {
                const tasks = [getBoardLifeNameMatches(cleanName)];
                if (built.key) {
                    tasks.push(
                        getBoardLifeSearchSnapshot(
                            db.collection('boardlifeGames').where('searchKeywords', 'array-contains', built.key).limit(10)
                        ).then(s => s.docs).catch(() => [])
                    );
                }
                const res = await Promise.all(tasks);
                const docsMap = new Map();
                res.flat().forEach(d => {
                    if (!docsMap.has(d.id)) docsMap.set(d.id, { id: d.id, ...d.data() });
                });
                const list = Array.from(docsMap.values());
                if (list.length === 0) return null;
                list.sort((a, b) => boardLifeMatchRank(a.name, normQ) - boardLifeMatchRank(b.name, normQ));
                return list[0];
            } catch (e) {
                return null;
            }
        }

        async function handleBoardLifeDBSearch(isLoadMore = false) {
            const mySeq = ++_searchSeq;
            const queryField = ($('#bl-db-search-input')?.value || '');
            const Sk = window.SearchKeywords;
            const built = Sk.buildSearchKey(queryField);
            const resultsEl = $('#bl-db-search-results');
            if (!resultsEl) return;

            if (!built.key) {
                resultsEl.innerHTML = built.reason === 'too_short'
                    ? '<p style="text-align:center; color:var(--text-light); padding:1rem;">2글자 이상 입력해주세요.</p>'
                    : '';
                currentSearchCursor = null;
                _lastBoardLifeSearchKey = null;
                return;
            }
            const query = built.key;
            const normQ = Sk.normalizeQuery(queryField);
            if (!isLoadMore && normQ === _lastBoardLifeSearchKey) return;

            if (!isLoadMore) {
                currentSearchCursor = null;
                _shownBoardLifeIds = new Set();
                resultsEl.innerHTML = '<div class="spinner" style="margin: 1rem auto;"></div>';
            } else {
                const loadBtn = resultsEl.querySelector('#load-more-btn');
                if (loadBtn) loadBtn.remove();
            }

            try {
                let dbQuery = db.collection('boardlifeGames').where('searchKeywords', 'array-contains', query).limit(20);
                if (currentSearchCursor) dbQuery = dbQuery.startAfter(currentSearchCursor);

                const [snap, nameDocs] = await Promise.all([
                    getBoardLifeSearchSnapshot(dbQuery),
                    isLoadMore ? Promise.resolve([]) : getBoardLifeNameMatches(queryField),
                ]);

                if (mySeq !== _searchSeq) return;
                _lastBoardLifeSearchKey = normQ;

                const docs = [];
                for (const d of [...nameDocs, ...snap.docs]) {
                    if (_shownBoardLifeIds.has(d.id)) continue;
                    _shownBoardLifeIds.add(d.id);
                    docs.push({ id: d.id, ...d.data() });
                }

                if (docs.length === 0) {
                    if (!isLoadMore) resultsEl.innerHTML = '<p style="text-align:center; color:var(--text-light); padding:1rem;">검색 결과가 없습니다.</p>';
                    return;
                }

                if (!isLoadMore) resultsEl.innerHTML = '';
                if (!snap.empty) currentSearchCursor = snap.docs[snap.docs.length - 1];

                if (!isLoadMore) docs.sort((a, b) => {
                    const sa = boardLifeMatchRank(a.name, normQ);
                    const sb = boardLifeMatchRank(b.name, normQ);
                    if (sa !== sb) return sa - sb;
                    const la = (a.name || '').length, lb = (b.name || '').length;
                    if (sa <= 1 && la !== lb) return la - lb;
                    return (a.name || '').localeCompare(b.name || '', 'ko');
                });

                docs.forEach(g => {
                    const dbNumId = getBlNumId(g);
                    const isAdded = (dbNumId && allUserGames.some(ug => getBlNumId(ug) === dbNumId)) || allUserGames.some(ug => ug.id === g.id);
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.style.display = 'grid';
                    item.style.gridTemplateColumns = '40px 1fr auto';
                    item.style.gap = '10px';
                    item.style.alignItems = 'center';

                    const thumbUrl = g.image || g.thumbnail || './placeholder.png';
                    item.innerHTML = `
                        <img src="${thumbUrl}" alt="${escapeHtmlSafe(g.name)}" style="width:40px; height:40px; object-fit:cover; border-radius:4px; border:1px solid var(--border-color);">
                        <div style="display:flex; flex-direction:column; overflow:hidden;">
                            <span class="name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtmlSafe(g.name)}</span>
                            <span class="year" style="font-size:0.8em; color:var(--text-secondary);">${g.yearPublished || ''}</span>
                        </div>
                        <button class="add-btn" ${isAdded ? 'disabled' : ''}>${isAdded ? '추가됨' : '추가'}</button>`;

                    if (!isAdded) {
                        item.querySelector('.add-btn').addEventListener('click', (e) => {
                            e.target.disabled = true;
                            handleAddBoardLifeDBGame(g, e.target);
                        });
                    }
                    resultsEl.appendChild(item);
                });

                if (snap.size >= 20) {
                    const btn = document.createElement('button');
                    btn.id = 'load-more-btn';
                    btn.className = 'filter-sort-btn';
                    btn.style.cssText = 'width:100%; margin-top:0.5rem; padding:0.75rem; text-align:center;';
                    btn.textContent = '+ 더보기';
                    btn.onclick = () => handleBoardLifeDBSearch(true);
                    resultsEl.appendChild(btn);
                }
            } catch (error) {
                console.error(error);
                if (!isLoadMore) resultsEl.innerHTML = '<p style="text-align:center; color:var(--text-light); padding:1rem;">검색 중 오류가 발생했습니다.</p>';
            }
        }

        function handleAddBoardLifeDBGame(blGame, buttonEl) {
            const docId = blGame.id;
            const isAutoExp = (blGame.themes || []).some(t => t.includes('본판이 필요한 확장')) || (blGame.categories || []).some(c => c.includes('확장') || c.toLowerCase().includes('expansion'));
            const customFields = { '구매일자': new Date().toISOString().slice(0, 10), '구매가격': '' };
            if (isAutoExp) customFields['확장판'] = 'true';

            const newGame = normalizeGameRecord({
                id: docId,
                boardlifeId: blGame.id,
                boardlifeNumId: blGame.boardlifeNumId,
                name: blGame.name,
                image: blGame.image || '',
                thumbnail: blGame.image || '',
                minplayers: blGame.minplayers || '0',
                maxplayers: blGame.maxplayers || '0',
                minplaytime: blGame.minplaytime || '0',
                maxplaytime: blGame.maxplaytime || '0',
                complexity: blGame.complexity || '0',
                bestplayercounts: blGame.bestplayercounts || [],
                categories: blGame.categories || [],
                themes: blGame.themes || [],
                mechanics: blGame.mechanics || [],
                designers: blGame.designers || [],
                publishers: blGame.publishers || [],
                rating: blGame.rating || '0',
                yearPublished: blGame.yearPublished || '',
                bggId: blGame.bggId || '',
                isManual: false,
                source: 'boardlife_db',
                createdAt: Date.now(),
                customFields
            });

            const existingIdx = allUserGames.findIndex(g => g.id === docId);
            if (existingIdx >= 0) allUserGames[existingIdx] = newGame;
            else allUserGames.unshift(newGame);

            persistData();
            renderFilteredGames();
            showMessage(`${blGame.name} 추가 완료!`, 'success');
            if (buttonEl) buttonEl.textContent = '추가됨';
        }

        function initRangeSlider(minInput, maxInput, rangeEl, minValEl, maxValEl, min, max, step, formatCallback) {
            const update = () => {
                let minVal = parseFloat(minInput.value), maxVal = parseFloat(maxInput.value);
                if (minVal > maxVal) [minVal, maxVal] = [maxVal, minVal];
                const minPct = ((minVal - min) / (max - min)) * 100, maxPct = ((maxVal - min) / (max - min)) * 100;
                rangeEl.style.left = `${minPct}%`;
                rangeEl.style.width = `${maxPct - minPct}%`;
                minValEl.textContent = formatCallback(minVal);
                maxValEl.textContent = formatCallback(maxVal);
            };
            minInput.addEventListener('input', update);
            maxInput.addEventListener('input', update);
            update();
        }

            dom.tagFilterContainer.innerHTML = '';
            if (allUserTags.length === 0) {
                dom.tagFilterContainer.innerHTML = '<p class="filter-no-tags-info">태그를 생성/관리하려면 + 버튼을 누르세요.</p>';
                return;
            }
            allUserTags.forEach(tag => {
                const tagEl = document.createElement('div');
                tagEl.className = 'tag-filter-item';
                tagEl.innerHTML = `
                    <input type="checkbox" id="tag-${tag.id}" data-tag-id="${tag.id}">
                    <label for="tag-${tag.id}">
                        <span class="tag-color-dot" style="background-color: ${tag.color};"></span>
                        ${escapeHtmlSafe(tag.name)}
                    </label>`;
                dom.tagFilterContainer.appendChild(tagEl);
            });
        }

        function getCurrentFilters() {
            return {
                name: dom.nameSearchInput.value.toLowerCase(),
                genre: dom.genreSearchInput.value.toLowerCase(),
                players: parseInt(dom.playerCountInput.value, 10) || 0,
                bestOnly: dom.bestPlayerToggle.checked,
                hideExpansions: dom.hideExpansionsToggle.checked,
                tags: Array.from(dom.tagFilterContainer.querySelectorAll('input:checked')).map(el => el.dataset.tagId),
                diffMin: parseFloat(dom.difficultyMin.value),
                diffMax: parseFloat(dom.difficultyMax.value),
                timeMin: parseInt(dom.timeMin.value, 10),
                timeMax: parseInt(dom.timeMax.value, 10)
            };
        }

        function applyFiltersToGames(games) {
            const filters = getCurrentFilters();
            return games.filter(game => {
                const customName = game.customFields && game.customFields['게임 이름'];
                const gameName = customName || game.name || '';
                if (filters.name && !gameName.toLowerCase().includes(filters.name)) return false;

                if (filters.hideExpansions) {
                    const categories = game.categories || [];
                    const themes = game.themes || [];
                    const customGenre = (game.customFields && game.customFields['장르']) || '';
                    const isExpChecked = game.customFields && (game.customFields['확장판'] === 'true' || game.customFields['확장판'] === 'O');
                    const isExp = isExpChecked || categories.some(c => c.toLowerCase().includes('expansion') || c.includes('확장')) ||
                        themes.some(t => t.includes('본판이 필요한 확장')) || customGenre.includes('확장');
                    if (isExp) return false;
                }

                if (filters.genre) {
                    const searchIn = [...(game.categories || []), ...(game.themes || []), ...(game.mechanics || []), (game.customFields && game.customFields['장르']) || ''].join(' ').toLowerCase();
                    if (!searchIn.includes(filters.genre)) return false;
                }

                if (filters.players > 0) {
                    const minP = parseInt(game.minplayers, 10), maxP = parseInt(game.maxplayers, 10);
                    if (!isNaN(minP) && filters.players < minP) return false;
                    if (!isNaN(maxP) && maxP > 0 && filters.players > maxP) return false;
                    if (filters.bestOnly) {
                        if (!game.bestplayercounts || game.bestplayercounts.length === 0) return false;
                        const isBest = game.bestplayercounts.some(bc => String(bc).includes(String(filters.players)));
                        if (!isBest) return false;
                    }
                }

                const compVal = parseFloat(game.complexity);
                if ((filters.diffMin > 1 || filters.diffMax < 5) && !isNaN(compVal) && compVal > 0) {
                    if (compVal < filters.diffMin || compVal > filters.diffMax) return false;
                }

                const gMinT = parseInt(game.minplaytime, 10), gMaxT = parseInt(game.maxplaytime, 10);
                const fMaxT = filters.timeMax >= 240 ? Infinity : filters.timeMax;
                if ((filters.timeMin > 0 || filters.timeMax < 240) && !isNaN(gMinT) && !isNaN(gMaxT) && (gMinT > 0 || gMaxT > 0)) {
                    if (gMaxT < filters.timeMin || gMinT > fMaxT) return false;
                }

                if (filters.tags.length > 0) {
                    const gTags = game.tags || [];
                    if (!filters.tags.every(tid => gTags.includes(tid))) return false;
                }
                return true;
            });
        }

        function cycleSort() {
            const sortCycle = { 'name-asc': 'name-desc', 'name-desc': 'difficulty-asc', 'difficulty-asc': 'difficulty-desc', 'difficulty-desc': 'recent-desc', 'recent-desc': 'name-asc' };
            const sortText = { 'name-asc': '정렬: 가나다순', 'name-desc': '정렬: 가나다역순', 'difficulty-asc': '정렬: 난이도 오름차순', 'difficulty-desc': '정렬: 난이도 내림차순', 'recent-desc': '정렬: 최근 추가된 순' };
            currentSort = sortCycle[currentSort];
            dom.sortBtn.textContent = sortText[currentSort];
            renderFilteredGames();
        }

        function sortGames(games) {
            games.sort((a, b) => {
                const nameA = (a.customFields && a.customFields['게임 이름']) || a.name || '';
                const nameB = (b.customFields && b.customFields['게임 이름']) || b.name || '';
                switch (currentSort) {
                    case 'name-asc': return nameA.localeCompare(nameB, 'ko');
                    case 'name-desc': return nameB.localeCompare(nameA, 'ko');
                    case 'difficulty-asc': return (parseFloat(a.complexity) || 0) - (parseFloat(b.complexity) || 0);
                    case 'difficulty-desc': return (parseFloat(b.complexity) || 0) - (parseFloat(a.complexity) || 0);
                    case 'recent-desc': return (b.createdAt || 0) - (a.createdAt || 0);
                    default: return 0;
                }
            });
        }

        function renderFilteredGames() {
            const filtered = applyFiltersToGames(allUserGames);
            sortGames(filtered);
            const container = dom.gameListContainer;
            container.innerHTML = '';
            dom.gameCountBadge.textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-state-text">해당하는 게임이 없습니다.</p>';
                container.className = 'game-grid';
                return;
            }
            container.className = currentViewMode === 'grid' ? 'game-grid' : 'game-list';
            filtered.forEach(game => renderGameCard(game, container));
        }

        function tagTextColor(hexColor) {
            if (!hexColor || typeof hexColor !== 'string') return '#ffffff';
            let h = hexColor.replace('#', '').trim();
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            if (h.length !== 6) return '#ffffff';
            const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
            return ((0.299 * r + 0.587 * g + 0.114 * b) / 255) > 0.6 ? '#1a1a1a' : '#ffffff';
        }

        function formatPlayersRange(game) {
            const minP = parseInt(game.minplayers, 10), maxP = parseInt(game.maxplayers, 10);
            if (!isNaN(minP) && !isNaN(maxP) && maxP > 0) return minP === maxP ? `${minP}명` : `${minP}–${maxP}명`;
            return !isNaN(minP) && minP > 0 ? `${minP}명` : '';
        }

        function formatTimeRange(game) {
            const minT = parseInt(game.minplaytime, 10), maxT = parseInt(game.maxplaytime, 10);
            if (!isNaN(minT) && !isNaN(maxT) && maxT > 0) return minT === maxT ? `${minT}분` : `${minT}–${maxT}분`;
            return !isNaN(minT) && minT > 0 ? `${minT}분` : '';
        }

        function renderGameCard(game, container) {
            const item = document.createElement('div');
            const custom = game.customFields || {};
            const displayName = custom['게임 이름'] || game.name;
            const imageUrl = custom['대표 이미지'] || game.image || game.thumbnail || 'https://placehold.co/300x300/6750A4/ffffff?text=' + encodeURIComponent(displayName);

            let tagsHtml = '';
            (game.tags || []).forEach(tagId => {
                const tag = allUserTags.find(t => t.id === tagId);
                if (tag) tagsHtml += `<span class="card-tag" style="background-color:${tag.color};color:${tagTextColor(tag.color)};">${escapeHtmlSafe(tag.name)}</span>`;
            });

            if (currentViewMode === 'grid') {
                item.className = 'game-card-grid';
                const subtitleTxt = [formatPlayersRange(game), formatTimeRange(game)].filter(Boolean).join(' · ');
                item.innerHTML = `
                    <div class="game-image">
                        <div class="card-tags-container">${tagsHtml}</div>
                        <img src="${imageUrl}" alt="${escapeHtmlSafe(displayName)}" loading="lazy" referrerpolicy="no-referrer">
                    </div>
                    <div class="game-title-grid">
                        <h3>${escapeHtmlSafe(displayName)}</h3>
                        ${subtitleTxt ? `<div class="game-card-subtitle">${subtitleTxt}</div>` : ''}
                    </div>`;
            } else {
                item.className = 'game-list-item';
                const priceTxt = custom['구매가격'] ? `${Number(String(custom['구매가격']).replace(/[^0-9]/g, '')).toLocaleString()}원` : '-';
                item.innerHTML = `
                    <div class="list-item-header">
                        <div>
                            <h3>${escapeHtmlSafe(displayName)}</h3>
                            <div class="list-item-tags">${tagsHtml}</div>
                        </div>
                    </div>
                    <div class="list-item-details">
                        <div class="list-detail-item"><strong>플레이 인원</strong><span>${formatPlayersRange(game) || '-'}</span></div>
                        <div class="list-detail-item"><strong>플레이 시간</strong><span>${formatTimeRange(game) || '-'}</span></div>
                        <div class="list-detail-item"><strong>난이도</strong><span>${game.complexity || 0}/5</span></div>
                        <div class="list-detail-item"><strong>구매일자</strong><span>${custom['구매일자'] || '-'}</span></div>
                        <div class="list-detail-item"><strong>구매가격</strong><span>${priceTxt}</span></div>
                    </div>`;
            }
            item.addEventListener('click', () => openDetailModal(game.id));
            container.appendChild(item);
        }

        /* =========================================================
           6. 게임 클릭 시 상세 모달 + 보드라이프 커버 자동 링크 + 구매가격/일자
           ========================================================= */
        async function openDetailModal(docId) {
            dom.detailModal.classList.remove('hidden');
            let game = allUserGames.find(g => g.id === docId);
            if (!game) return;

            renderModalContent(game);

            // 클릭한 게임의 커버 이미지가 비어있거나 placeholder인 경우 boardlifeGames DB에서 자동으로 찾아 링크!
            const currentCover = (game.customFields && game.customFields['대표 이미지']) || game.image || '';
            if (!currentCover || currentCover.includes('placehold') || currentCover.includes('unsplash')) {
                await autoMatchBoardLifeCoverForGame(game, false);
            }
        }

        async function autoMatchBoardLifeCoverForGame(game, showToastMsg = true) {
            const matched = await findBestBoardLifeGameByName(game.name);
            if (matched && matched.image) {
                game.image = matched.image;
                game.thumbnail = matched.image;
                if (!game.customFields) game.customFields = {};
                game.customFields['대표 이미지'] = matched.image;
                if (!game.minplayers || game.minplayers === '0') game.minplayers = matched.minplayers || '1';
                if (!game.maxplayers || game.maxplayers === '0') game.maxplayers = matched.maxplayers || '4';
                if (!game.minplaytime || game.minplaytime === '0') game.minplaytime = matched.minplaytime || '60';
                if (!game.maxplaytime || game.maxplaytime === '0') game.maxplaytime = matched.maxplaytime || '60';
                if (!game.complexity || game.complexity === '0') game.complexity = matched.complexity || '2.5';
                persistData();
                renderFilteredGames();
                if (!dom.detailModal.classList.contains('hidden')) {
                    renderModalContent(game);
                }
                if (showToastMsg) showMessage(`✅ 보드라이프 DB('${matched.name}') 커버 이미지를 성공적으로 연결했습니다!`, 'success');
            } else if (showToastMsg) {
                showMessage('보드라이프 DB에서 일치하는 게임을 찾지 못했습니다.', 'error');
            }
        }

        function renderModalContent(game) {
            const custom = game.customFields || {};
            const displayName = custom['게임 이름'] || game.name;
            const coverImage = custom['대표 이미지'] || game.image || game.thumbnail || 'https://placehold.co/400x400/6750A4/ffffff?text=' + encodeURIComponent(displayName);

            const pmin = game.minplayers || 0, pmax = game.maxplayers || 0;
            const playerStr = (pmin === pmax) ? `${pmax}명` : `${pmin}-${pmax}명`;
            const tmin = game.minplaytime || 0, tmax = game.maxplaytime || 0;
            const timeStr = (tmin === tmax) ? `${tmax}분` : `${tmin}-${tmax}분`;
            const difficultyStr = `${(parseFloat(game.complexity) || 0).toFixed(1)}/5`;
            const bestArr = Array.isArray(game.bestplayercounts) ? game.bestplayercounts.filter(Boolean) : [];
            const bestStr = bestArr.length ? bestArr.join(', ') + '명' : '';

            const cval = key => custom[key] || '';
            const mkCheckbox = (label, key) => `
                <label class="management-checkbox-label">
                    <input type="checkbox" class="sync-input" data-custom-key="${key}" ${(cval(key) === 'O' || cval(key) === 'true') ? 'checked' : ''}>
                    ${label}
                </label>`;
            const mkInput = (label, key, placeholder, type, suffix = '') => `
                <div class="management-row column">
                    <span class="management-label" style="font-size: 0.9em; color: var(--text-secondary);"><strong>${label}</strong></span>
                    <div class="inline-input-group">
                        <input type="${type}" class="sync-input" data-custom-key="${key}" placeholder="${placeholder}" value="${escapeHtmlSafe(cval(key))}">
                        ${suffix ? `<span class="suffix">${suffix}</span>` : ''}
                    </div>
                </div>`;

            const tagChipsHtml = (game.tags || []).map(tagId => {
                const tag = allUserTags.find(t => t.id === tagId);
                return tag ? `<span class="detail-tag-chip" style="background-color:${tag.color};color:${tagTextColor(tag.color)};">${escapeHtmlSafe(tag.name)}</span>` : '';
            }).join('');

            const myRating = game.myRating || null;
            const ratingBtnLabel = myRating ? `★ ${Number(myRating).toFixed(1)}` : '★ 별점';

            const purchaseTabHtml = `
                <div class="detail-tab-section purchase-tab">
                    <div class="management-subhead">구매 정보 (마이페이지 통계 자동 연동)</div>
                    ${mkInput('구매 일자', '구매일자', 'YYYY-MM-DD', 'date')}
                    ${mkInput('구매 가격', '구매가격', '0', 'number', '원')}
                    ${mkInput('커버 이미지 URL (보드라이프/웹)', '대표 이미지', 'https://...', 'text')}
                    ${mkInput('언어판', '언어판', '예: 한국어판, 영문판', 'text')}
                    <div class="management-subhead" style="margin-top: 1rem;">관리 현황</div>
                    <div class="management-checks">
                        ${mkCheckbox('슬리브 완료', '슬리브')}
                        ${mkCheckbox('박스 아스테이지 완료', '포장')}
                        ${mkCheckbox('컴포 업그레이드', '컴포')}
                        ${mkCheckbox('확장판', '확장판')}
                    </div>
                </div>`;

            const memoTabHtml = `
                <div class="detail-tab-section memo-tab">
                    <textarea id="memo-textarea" class="memo-box" placeholder="메모를 입력하세요...">${escapeHtmlSafe(game.memo || '')}</textarea>
                </div>`;

            const playTabHtml = `
                <div class="detail-tab-section play-tab">
                    <div class="play-tab-stats">
                        <div class="play-tab-stat">
                            <div class="play-tab-stat-value">${Number(game.plays) || 0}</div>
                            <div class="play-tab-stat-label">총 플레이 횟수</div>
                        </div>
                    </div>
                    <a href="./sessions.html" class="play-tab-link-btn" style="margin-top:0.75rem;">📅 게임 기록 페이지로 이동</a>
                </div>`;

            dom.detailModal.innerHTML = `
                <div class="detail-content detail-content-v2" data-doc-id="${game.id}">
                    <button class="modal-close-btn" style="z-index:100;">&times;</button>
                    <div class="modal-left">
                        <img src="${coverImage}" alt="${escapeHtmlSafe(displayName)}" referrerpolicy="no-referrer">
                        <button class="image-manage-icon-btn" id="auto-bl-cover-btn" title="보드라이프 커버 자동 매칭">🔄</button>
                    </div>
                    <div class="modal-right">
                        <div class="dashboard-content">
                            <div class="detail-header-block">
                                <div class="detail-title-row">
                                    <h2 class="detail-game-title">${escapeHtmlSafe(displayName)}</h2>
                                </div>
                                ${tagChipsHtml ? `<div class="detail-tag-row">${tagChipsHtml}</div>` : ''}
                                <div class="detail-actions-row">
                                    <button id="my-rating-btn" class="detail-action-pill my-rating-btn" type="button">${ratingBtnLabel}</button>
                                    <button id="manage-tags-btn" class="detail-action-pill" type="button">🏷️ 태그</button>
                                    <button id="rematch-cover-pill" class="detail-action-pill" type="button">🖼️ 보드라이프 커버 자동매칭</button>
                                </div>
                            </div>

                            <div class="quick-stats-grid">
                                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${playerStr}</div><div class="stat-label">인원</div></div>
                                ${bestStr ? `<div class="stat-card stat-card-best"><div class="stat-icon">⭐</div><div class="stat-value">${bestStr}</div><div class="stat-label">베스트</div></div>` : ''}
                                <div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-value">${timeStr}</div><div class="stat-label">시간</div></div>
                                <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-value">${difficultyStr}</div><div class="stat-label">난이도</div></div>
                            </div>

                            <div class="detail-tab-bar" role="tablist">
                                <button type="button" class="detail-tab-btn active" data-tab="purchase" role="tab">구매/관리</button>
                                <button type="button" class="detail-tab-btn" data-tab="memo" role="tab">메모</button>
                                <button type="button" class="detail-tab-btn" data-tab="play" role="tab">플레이</button>
                            </div>

                            <div class="detail-tab-panels">
                                <div class="detail-tab-panel active" data-tab="purchase">${purchaseTabHtml}</div>
                                <div class="detail-tab-panel" data-tab="memo">${memoTabHtml}</div>
                                <div class="detail-tab-panel" data-tab="play">${playTabHtml}</div>
                            </div>
                        </div>
                        <div class="modal-footer" style="justify-content: flex-end; gap: 0.5rem;">
                            <button id="delete-game-btn" class="detail-section-icon-btn" style="color:var(--delete-color);" title="삭제">🗑️</button>
                            <button id="save-now-btn" class="detail-section-btn" style="padding:0.4rem 0.9rem;">💾 저장</button>
                        </div>
                    </div>
                </div>`;
        }

        function saveDetailModalChanges(docId, modalContentEl, showToast = false) {
            const game = allUserGames.find(g => g.id === docId);
            if (!game) return;
            const newCustom = { ...(game.customFields || {}) };

            modalContentEl.querySelectorAll('.sync-input[type="checkbox"]').forEach(el => {
                const k = el.dataset.customKey;
                if (k) newCustom[k] = el.checked ? 'O' : '';
            });
            modalContentEl.querySelectorAll('.sync-input:not([type="checkbox"])').forEach(el => {
                const k = el.dataset.customKey;
                if (k) newCustom[k] = el.value.trim();
            });

            const memoArea = modalContentEl.querySelector('#memo-textarea');
            if (memoArea) game.memo = memoArea.value;

            game.customFields = newCustom;
            if (newCustom['대표 이미지']) game.image = newCustom['대표 이미지'];
            game.purchasePrice = parseInt(String(newCustom['구매가격'] || '0').replace(/[^0-9]/g, ''), 10) || 0;
            game.purchaseDate = normalizeDateStr(newCustom['구매일자'] || '');

            persistData();
            renderFilteredGames();
            if (showToast) showMessage('저장되었습니다.', 'success');
        }

        function initModalListeners() {
            dom.detailModal.addEventListener('click', async (e) => {
                const modalContentEl = e.target.closest('.detail-content');
                if (!modalContentEl) return;
                const docId = modalContentEl.dataset.docId;
                const game = allUserGames.find(g => g.id === docId);
                if (!game) return;

                if (e.target.matches('.modal-close-btn')) {
                    saveDetailModalChanges(docId, modalContentEl, false);
                    dom.detailModal.classList.add('hidden');
                } else if (e.target.matches('#save-now-btn')) {
                    saveDetailModalChanges(docId, modalContentEl, true);
                    renderModalContent(allUserGames.find(g => g.id === docId));
                } else if (e.target.matches('#delete-game-btn') || e.target.closest('#delete-game-btn')) {
                    if (confirm(`'${game.name}' 게임을 책장에서 삭제할까요?`)) {
                        allUserGames = allUserGames.filter(g => g.id !== docId);
                        persistData();
                        renderFilteredGames();
                        dom.detailModal.classList.add('hidden');
                        showMessage('삭제되었습니다.', 'success');
                    }
                } else if (e.target.matches('#auto-bl-cover-btn') || e.target.matches('#rematch-cover-pill')) {
                    await autoMatchBoardLifeCoverForGame(game, true);
                } else if (e.target.matches('#manage-tags-btn')) {
                    openTagApplyModal(docId, game.tags || []);
                } else if (e.target.matches('#my-rating-btn')) {
                    const input = prompt('내 별점을 입력하세요 (0.5 ~ 10):', game.myRating || 8.5);
                    if (input !== null) {
                        const val = parseFloat(input);
                        if (!isNaN(val)) {
                            game.myRating = Math.min(10, Math.max(0, val));
                            persistData();
                            renderModalContent(game);
                            renderFilteredGames();
                        }
                    }
                } else if (e.target.matches('.detail-tab-btn')) {
                    const targetTab = e.target.dataset.tab;
                    modalContentEl.querySelectorAll('.detail-tab-btn').forEach(b => b.classList.toggle('active', b === e.target));
                    modalContentEl.querySelectorAll('.detail-tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === targetTab));
                }
            });

            dom.detailModal.addEventListener('input', (e) => {
                const modalContentEl = e.target.closest('.detail-content');
                const docId = modalContentEl?.dataset.docId;
                if (!docId) return;
                clearTimeout(autoSaveDebounceTimer);
                autoSaveDebounceTimer = setTimeout(() => saveDetailModalChanges(docId, modalContentEl, false), 800);
            });
        }

        /* =========================================================
           7. 모달 열기/직접 추가/URL 추가/태그 관리
           ========================================================= */
        function initAddGameModals() {
            dom.addGameButton.addEventListener('click', () => {
                dom.searchPanel.classList.remove('hidden');
                const inputEl = $('#bl-db-search-input');
                if (inputEl) setTimeout(() => inputEl.focus(), 50);
            });
            dom.searchPanel.querySelector('.modal-close-btn').addEventListener('click', () => dom.searchPanel.classList.add('hidden'));

            const blDbInput = $('#bl-db-search-input');
            if (blDbInput) {
                blDbInput.addEventListener('input', () => {
                    clearTimeout(boardLifeSearchDebounceTimer);
                    boardLifeSearchDebounceTimer = setTimeout(() => handleBoardLifeDBSearch(false), 150);
                });
            }

            dom.openManualAddBtn.addEventListener('click', () => {
                dom.searchPanel.classList.add('hidden');
                $('#manual-purchase-date').value = new Date().toISOString().slice(0, 10);
                dom.manualAddPanel.classList.remove('hidden');
            });
            dom.manualAddPanel.querySelector('.modal-close-btn').addEventListener('click', () => dom.manualAddPanel.classList.add('hidden'));

            $('#manual-auto-cover-btn').addEventListener('click', async () => {
                const title = $('#manual-name').value.trim();
                if (!title) { showMessage('게임 이름을 먼저 입력해주세요.', 'error'); return; }
                const found = await findBestBoardLifeGameByName(title);
                if (found) {
                    $('#manual-image-url').value = found.image || '';
                    if (found.minplayers) $('#manual-minplayers').value = found.minplayers;
                    if (found.maxplayers) $('#manual-maxplayers').value = found.maxplayers;
                    if (found.minplaytime) $('#manual-minplaytime').value = found.minplaytime;
                    if (found.maxplaytime) $('#manual-maxplaytime').value = found.maxplaytime;
                    if (found.complexity) $('#manual-complexity').value = found.complexity;
                    if (found.categories) $('#manual-genre').value = found.categories.join(', ');
                    showMessage(`✅ '${found.name}' 커버 및 정보를 자동 매칭했습니다!`, 'success');
                } else {
                    showMessage('일치하는 보드라이프 DB 게임이 없습니다.', 'error');
                }
            });

            dom.manualAddForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = $('#manual-name').value.trim();
                if (!name) return;
                let imageUrl = $('#manual-image-url').value.trim();
                if (!imageUrl) {
                    const matched = await findBestBoardLifeGameByName(name);
                    if (matched && matched.image) imageUrl = matched.image;
                }

                const newGame = normalizeGameRecord({
                    id: `manual_${Date.now()}`,
                    name,
                    image: imageUrl,
                    minplayers: $('#manual-minplayers').value || '1',
                    maxplayers: $('#manual-maxplayers').value || '4',
                    minplaytime: $('#manual-minplaytime').value || '30',
                    maxplaytime: $('#manual-maxplaytime').value || '60',
                    complexity: $('#manual-complexity').value || '2.5',
                    categories: ($('#manual-genre').value || '').split(',').map(s => s.trim()).filter(Boolean),
                    isManual: true,
                    createdAt: Date.now(),
                    customFields: {
                        '구매일자': $('#manual-purchase-date').value || '',
                        '구매가격': $('#manual-purchase-price').value || '',
                        '대표 이미지': imageUrl
                    }
                });

                allUserGames.unshift(newGame);
                persistData();
                renderFilteredGames();
                dom.manualAddForm.reset();
                dom.manualAddPanel.classList.add('hidden');
                showMessage(`${name} 추가 완료!`, 'success');
            });

            dom.openBoardlifeAddBtn.addEventListener('click', () => {
                dom.searchPanel.classList.add('hidden');
                dom.boardlifeAddPanel.classList.remove('hidden');
            });
            dom.boardlifeAddPanel.querySelector('.modal-close-btn').addEventListener('click', () => dom.boardlifeAddPanel.classList.add('hidden'));

            dom.boardlifeAddForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = dom.boardlifeUrlInput.value.trim();
                const m = url.match(/(?:game\/|bbs_num=|bl_)(\d+)/i);
                if (!m) { showMessage('유효한 보드라이프 게임 URL을 입력해주세요.', 'error'); return; }
                const docId = `bl_${m[1]}`;
                try {
                    const doc = await db.collection('boardlifeGames').doc(docId).get();
                    if (doc.exists) {
                        handleAddBoardLifeDBGame({ id: doc.id, ...doc.data() });
                        dom.boardlifeUrlInput.value = '';
                        dom.boardlifeAddPanel.classList.add('hidden');
                    } else {
                        showMessage(`DB에 아직 없는 번호(${docId})입니다. 직접 입력을 이용해주세요.`, 'error');
                    }
                } catch (err) {
                    showMessage('조회 실패', 'error');
                }
            });
        }

        function openTagApplyModal(docId, currentGameTags) {
            let currentTags = [...currentGameTags];
            const modalEl = document.createElement('div');
            modalEl.className = 'modal tag-manage-modal';
            const tagsListHtml = allUserTags.map(tag => {
                const isSel = currentTags.includes(tag.id);
                return `<button type="button" class="tag-apply-chip ${isSel ? 'selected' : ''}" data-tag-id="${tag.id}" style="--tag-color:${tag.color};">
                    <span class="tag-apply-check">✓</span>
                    <span class="tag-apply-dot" style="background-color:${tag.color};"></span>
                    <span class="tag-apply-name">${escapeHtmlSafe(tag.name)}</span>
                </button>`;
            }).join('');

            modalEl.innerHTML = `<div class="search-panel-content tag-apply-panel">
                <button class="modal-close-btn">&times;</button>
                <h2>태그 적용/해제</h2>
                <div class="tag-apply-grid">${tagsListHtml || '<p class="tag-apply-empty">생성된 태그가 없습니다.</p>'}</div>
                <div class="tag-apply-footer">
                    <button id="cancel-tags-btn" class="tag-apply-cancel-btn">취소</button>
                    <button id="save-tags-btn" class="tag-apply-save-btn">적용</button>
                </div>
            </div>`;

            modalEl.querySelector('.modal-close-btn').onclick = () => modalEl.remove();
            modalEl.querySelector('#cancel-tags-btn').onclick = () => modalEl.remove();
            modalEl.querySelectorAll('.tag-apply-chip').forEach(chip => {
                chip.onclick = () => {
                    const tid = chip.dataset.tagId;
                    if (currentTags.includes(tid)) currentTags = currentTags.filter(id => id !== tid);
                    else currentTags.push(tid);
                    chip.classList.toggle('selected');
                };
            });
            modalEl.querySelector('#save-tags-btn').onclick = () => {
                const game = allUserGames.find(g => g.id === docId);
                if (game) {
                    game.tags = currentTags;
                    persistData();
                    renderFilteredGames();
                    renderModalContent(game);
                }
                modalEl.remove();
            };
            document.body.appendChild(modalEl);
        }

        function openGlobalTagManager() {
            const modalEl = document.createElement('div');
            modalEl.className = 'modal tag-manage-modal';
            const render = () => {
                const listHtml = allUserTags.map(tag => `
                    <div class="tag-manage-item" data-tag-id="${tag.id}">
                        <div class="tag-manage-item-info">
                            <span class="tag-color-dot" style="background-color:${tag.color};"></span>
                            <span>${escapeHtmlSafe(tag.name)}</span>
                        </div>
                        <button class="tag-delete-btn" data-tag-id="${tag.id}">&times;</button>
                    </div>`).join('');
                modalEl.innerHTML = `
                    <div class="search-panel-content">
                        <button class="modal-close-btn">&times;</button>
                        <h2>전체 태그 관리</h2>
                        <div class="tag-manage-list">${listHtml || '<p>생성된 태그가 없습니다.</p>'}</div>
                        <div class="tag-create-form">
                            <input type="text" id="new-tag-name" class="filter-input" placeholder="새 태그 이름 (최대 6자)" maxlength="6">
                            <input type="color" id="new-tag-color" value="#6750A4" style="width:42px; height:42px; border:none; cursor:pointer;">
                            <button id="create-tag-btn" class="detail-section-btn">생성</button>
                        </div>
                    </div>`;
                modalEl.querySelector('.modal-close-btn').onclick = () => modalEl.remove();
                modalEl.querySelectorAll('.tag-delete-btn').forEach(btn => {
                    btn.onclick = () => {
                        const tid = btn.dataset.tagId;
                        allUserTags = allUserTags.filter(t => t.id !== tid);
                        allUserGames.forEach(g => g.tags = (g.tags || []).filter(id => id !== tid));
                        persistData();
                        renderTagFilters();
                        renderFilteredGames();
                        render();
                    };
                });
                modalEl.querySelector('#create-tag-btn').onclick = () => {
                    const name = modalEl.querySelector('#new-tag-name').value.trim();
                    const color = modalEl.querySelector('#new-tag-color').value;
                    if (!name) return;
                    allUserTags.push({ id: `t_${Date.now()}`, name, color });
                    persistData();
                    renderTagFilters();
                    render();
                };
            };
            render();
            document.body.appendChild(modalEl);
        }

        function initMobileSidebar() {
            dom.openFilterBtn.onclick = () => { dom.filterSidebar.classList.add('open'); dom.filterOverlay.classList.remove('hidden'); };
            const close = () => { dom.filterSidebar.classList.remove('open'); dom.filterOverlay.classList.add('hidden'); };
            dom.closeFilterBtn.onclick = close;
            dom.filterOverlay.onclick = close;
        }

        function initViewToggle() {
            const updateIcon = () => {
                const g = dom.viewToggleButton.querySelector('.grid-icon'), l = dom.viewToggleButton.querySelector('.list-icon');
                if (currentViewMode === 'grid') { g.classList.add('hidden'); l.classList.remove('hidden'); l.classList.add('active'); }
                else { l.classList.add('hidden'); g.classList.remove('hidden'); g.classList.add('active'); }
            };
            updateIcon();
            dom.viewToggleButton.onclick = () => {
                currentViewMode = currentViewMode === 'grid' ? 'list' : 'grid';
                updateIcon();
                renderFilteredGames();
            };
        }

        function initMobileAppLikeUI() {
            if (dom.mobileSearchInput && dom.nameSearchInput) {
                dom.mobileSearchInput.addEventListener('input', () => {
                    dom.nameSearchInput.value = dom.mobileSearchInput.value;
                    dom.nameSearchInput.dispatchEvent(new Event('input'));
                });
            }
            if (dom.playerChipsRow && dom.playerCountInput) {
                dom.playerChipsRow.addEventListener('click', (e) => {
                    const chip = e.target.closest('.player-chip');
                    if (!chip) return;
                    const val = chip.dataset.players;
                    dom.playerChipsRow.querySelectorAll('.player-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    dom.playerCountInput.value = val === '0' ? '' : val;
                    renderFilteredGames();
                });
            }
            if (dom.fabAddGame && dom.addGameButton) {
                dom.fabAddGame.onclick = () => dom.addGameButton.click();
            }
        }

        function randomPickGame() {
            const filtered = applyFiltersToGames(allUserGames);
            if (filtered.length === 0) { showMessage('조건에 맞는 게임이 없습니다.', 'error'); return; }
            const picked = filtered[Math.floor(Math.random() * filtered.length)];
            showMessage(`🎲 제비뽑기 결과: ${picked.name}`, 'success');
            setTimeout(() => openDetailModal(picked.id), 400);
        }

        function escapeHtmlSafe(str) {
            if (str == null) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function showMessage(message, type = 'success') {
            const el = document.createElement('div');
            el.className = `message ${type}`;
            el.textContent = message;
            dom.messageContainer.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    </script>
</body>
</html>
