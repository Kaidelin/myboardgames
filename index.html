<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>나의 보드게임 책장 - myboardgames</title>
    <link rel="stylesheet" href="style.css?v=19">
    <meta name="theme-color" content="#F7F2FA">
    <style>
        /* M-1 일괄 편집 표 모달 스타일 */
        .bulk-editor-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .bulk-editor-table th, .bulk-editor-table td { padding: 0.5rem; border-bottom: 1px solid var(--border-color); text-align: left; }
        .bulk-editor-table th { background: var(--bg-secondary); color: var(--text-secondary); font-size: 0.75rem; }
        .bulk-input { width: 100%; padding: 0.35rem 0.5rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-main); color: var(--text-primary); font-size: 0.85rem; }
    </style>

<body>

    <div class="main-layout" id="app-container">
        <aside id="filter-sidebar" class="filter-sidebar">
            <div class="filter-header">
                <h3>상세 검색</h3>
                <button id="close-filter-btn" class="close-btn">&times;</button>
            </div>
            <div class="controls">
                <div class="filter-group">
                    <button id="sort-btn" class="filter-sort-btn">정렬: 가나다순</button>
                </div>
                <div class="search-box">
                    <label for="nameSearchInput">게임 이름</label>
                    <input type="text" id="nameSearchInput" class="filter-input" placeholder="게임 이름으로 검색">
                </div>
                <div class="search-box">
                    <label for="genreSearchInput">장르</label>
                    <input type="text" id="genreSearchInput" class="filter-input" placeholder="장르로 검색">
                </div>
                <div class="filter-group">
                    <label for="playerCountInput">플레이 인원</label>
                    <input type="number" id="playerCountInput" class="filter-input" placeholder="인원수를 입력하세요">
                    <div class="toggle-group">
                        <label class="toggle-switch" for="bestPlayerToggle">
                            <input type="checkbox" id="bestPlayerToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <label for="bestPlayerToggle" class="toggle-label">베스트 인원으로 검색</label>
                    </div>
                </div>
                <div class="filter-group">
                    <div class="section-header" style="margin-bottom: 0.5rem;">
                        <label style="margin-bottom: 0;">태그</label>
                        <button id="open-global-tag-manager-btn" class="detail-section-icon-btn" title="태그 생성/수정/삭제">

                                fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <div id="tag-filter-container" class="tag-filter-container"></div>
                </div>
                <div class="filter-group">
                    <label>옵션</label>
                    <div class="toggle-group" style="margin-top: 0;">
                        <label class="toggle-switch" for="hideExpansionsToggle">
                            <input type="checkbox" id="hideExpansionsToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                        <label for="hideExpansionsToggle" class="toggle-label">확장 숨김</label>
                    </div>
                </div>
                <div class="filter-group">
                    <label>난이도:</label>
                    <div class="slider-wrapper">
                        <div class="slider-track"></div>
                        <div class="slider-range" id="difficultyRange"></div>
                        <input type="range" id="difficultyMin" min="1" max="5" value="1" step="0.1" aria-label="최소 난이도">
                        <input type="range" id="difficultyMax" min="1" max="5" value="5" step="0.1" aria-label="최대 난이도">
                    </div>
                    <div class="slider-values">
                        <span id="difficultyMinValue">1.0</span> - <span id="difficultyMaxValue">5.0</span>
                    </div>
                </div>
                <div class="filter-group">
                    <label>플레이 시간 (분):</label>
                    <div class="slider-wrapper">
                        <div class="slider-track"></div>
                        <div class="slider-range" id="timeRange"></div>
                        <input type="range" id="timeMin" min="0" max="240" value="0" step="10" aria-label="최소 플레이 시간">
                        <input type="range" id="timeMax" min="0" max="240" value="240" step="10" aria-label="최대 플레이 시간">
                    </div>
                    <div class="slider-values">
                        <span id="timeMinValue">0분</span> - <span id="timeMaxValue">240분+</span>
                    </div>
                </div>

                <div class="filter-group" style="margin-top: 1.5rem;">
                    <button id="random-pick-btn" class="filter-sort-btn random-pick-btn">
                        🎲 제비뽑기
                    </button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header id="page-header">
                <h1 id="header-title">
                    <span id="user-nickname-line1">나의</span>
                    <span id="header-subtitle">

                            <line x1="3" y1="6" x2="3.01" y2="6"></line>

                    <a href="./sessions.html" id="sessions-nav-btn" class="action-icon-btn desktop-only-btn" title="게임 기록">

    <script>
        /* =========================================================
           1. 자모 분해 & 실시간 Firestore REST API 엔진
           ========================================================= */
        (function (global) {
            const HANGUL_BASE = 0xAC00, HANGUL_END = 0xD7A3, MAX_INDEXED_KEY_LENGTH = 12;
            const CHOSUNG_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const CHOSUNG_SET = new Set(CHOSUNG_LIST);
            const JUNGSUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
            const JONGSUNG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const COMPOUND_JONG = {'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
            const COMPOUND_JUNG = {'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};

            function decomposeHangul(str) {
                let out = '';
                for (const ch of (str || '')) {
                    const code = ch.charCodeAt(0);
                    if (code >= HANGUL_BASE && code <= HANGUL_END) {
                        const idx = code - HANGUL_BASE;
                        const cho = CHOSUNG_LIST[Math.floor(idx / 588)];

                return out;

            function isAllChosung(s) { if (!s) return false; for (const ch of s) { if (!CHOSUNG_SET.has(ch)) return false; } return true; }
            function buildSearchKey(input) {

            if (_cachedIdToken && Date.now() < _cachedIdTokenExp) return _cachedIdToken;

        function parseFirestoreValue(v) {
            if (!v || typeof v !== 'object') return null;
            if ('stringValue' in v) return v.stringValue;
            if ('integerValue' in v) return String(v.integerValue);
            if ('doubleValue' in v) return String(v.doubleValue);
            if ('booleanValue' in v) return Boolean(v.booleanValue);
            if ('nullValue' in v) return null;
            if ('timestampValue' in v) return v.timestampValue;
            if ('arrayValue' in v) return (v.arrayValue.values || []).map(parseFirestoreValue);
            if ('mapValue' in v) {
                const out = {};
                const fields = v.mapValue.fields || {};
                for (const k in fields) out[k] = parseFirestoreValue(fields[k]);
                return out;
            }
            return null;
        }

        function parseRestDoc(doc) {
            if (!doc || !doc.name) return null;
            const id = doc.name.split('/').pop();
            const out = { id };
            const fields = doc.fields || {};
            for (const k in fields) out[k] = parseFirestoreValue(fields[k]);
            return out;
        }

        async function runRestQuery(structuredQuery, idToken) {
            const headers = { 'Content-Type': 'application/json' };
            if (idToken) headers['Authorization'] = `Bearer ${idToken}`;
            const resp = await fetch(`https://firestore.googleapis.com/v1/projects/${FB_PROJECT_ID}/databases/(default)/documents:runQuery`, {
                method: 'POST', headers, body: JSON.stringify({ structuredQuery })
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const rows = await resp.json();
            const docs = [];
            (rows || []).forEach(r => { if (r.document) { const p = parseRestDoc(r.document); if (p) docs.push(p); } });
            return docs;
        }

        async function searchRealtimeBoardLifeDB(rawQuery, limitCount = 25) {
            const Sk = window.SearchKeywords;
            const trimmed = (rawQuery || '').trim();
            const built = Sk.buildSearchKey(trimmed);
            if (!built.key) return { docs: [], reason: built.reason };

            const idToken = await getValidFirebaseIdToken();
            const qNgram = {
                from: [{ collectionId: 'boardlifeGames' }],
                where: { fieldFilter: { field: { fieldPath: 'searchKeywords' }, op: 'ARRAY_CONTAINS', value: { stringValue: built.key } } },
                limit: limitCount
            };
            const queryPromises = [runRestQuery(qNgram, idToken)];

            if (!Sk.isAllChosung(Sk.normalizeQuery(trimmed))) {
                const qExact = {
                    from: [{ collectionId: 'boardlifeGames' }],
                    where: { fieldFilter: { field: { fieldPath: 'searchKeywords' }, op: 'ARRAY_CONTAINS', value: { stringValue: Sk.buildExactNameKey(trimmed) } } },
                    limit: 5
                };
                const qPrefix = {
                    from: [{ collectionId: 'boardlifeGames' }],
                    where: { compositeFilter: { op: 'AND', filters: [
                        { fieldFilter: { field: { fieldPath: 'name' }, op: 'GREATER_THAN_OR_EQUAL', value: { stringValue: trimmed } } },
                        { fieldFilter: { field: { fieldPath: 'name' }, op: 'LESS_THAN_OR_EQUAL', value: { stringValue: trimmed + '\uf8ff' } } }
                    ]}},
                    orderBy: [{ field: { fieldPath: 'name' }, direction: 'ASCENDING' }],
                    limit: 10
                };
                queryPromises.push(runRestQuery(qExact, idToken).catch(() => []), runRestQuery(qPrefix, idToken).catch(() => []));
            }

            const [ngramDocs, exactDocs = [], prefixDocs = []] = await Promise.all(queryPromises);
            const seen = new Set();
            const merged = [];
            for (const d of [...exactDocs, ...prefixDocs, ...ngramDocs]) {
                if (seen.has(d.id)) continue;
                seen.add(d.id);
                merged.push(d);
            }

            const normQ = Sk.normalizeQuery(trimmed);
            merged.sort((a, b) => {
                const sa = boardLifeMatchRank(a.name, normQ);
                const sb = boardLifeMatchRank(b.name, normQ);
                if (sa !== sb) return sa - sb;
                return (a.name || '').length - (b.name || '').length;
            });

            return { docs: merged, reason: 'ok' };
        }

            if (numMatch) {

            }
            try {

                if (docs.length > 0) return docs[0];
            } catch (e) {}
            return null;
        }

                    <td style="font-weight:600;">${escapeHtmlSafe(g.name)}</td>
                    <td><input type="date" class="bulk-input b-date" value="${parseDateYMD(g)}"></td>
                    <td><input type="number" class="bulk-input b-price" value="${parsePrice(g)}" placeholder="0"></td>
                    <td><input type="text" class="bulk-input b-sleeve-size" value="${escapeHtmlSafe(g.sleeveSize || '')}" placeholder="예: 63.5x88"></td>
                    <td><input type="number" class="bulk-input b-sleeve-count" value="${g.sleeveCount || ''}" placeholder="매수"></td>
                    <td style="text-align:center;"><input type="checkbox" class="b-sleeve-done" ${(g.customFields && (g.customFields['슬리브'] === 'O' || g.customFields['슬리브'] === 'true')) ? 'checked' : ''}></td>
                </tr>`).join('');
            $('#bulk-editor-modal').classList.remove('hidden');
        }

        function saveBulkEditorChanges() {
            const rows = $$('#bulk-editor-tbody tr');
            rows.forEach(row => {
                const idx = parseInt(row.dataset.gameIdx, 10);
                const g = allUserGames[idx];
                if (!g) return;
                const d = row.querySelector('.b-date').value;
                const p = row.querySelector('.b-price').value;
                const sSize = row.querySelector('.b-sleeve-size').value.trim();
                const sCnt = parseInt(row.querySelector('.b-sleeve-count').value, 10) || 0;
                const sDone = row.querySelector('.b-sleeve-done').checked;

                if (!g.customFields) g.customFields = {};
                g.customFields['구매일자'] = d;
                g.customFields['구매가격'] = p;
                g.customFields['슬리브'] = sDone ? 'O' : '';
                g.purchaseDate = d;
                g.purchasePrice = parseInt(p, 10) || 0;
                g.sleeveSize = sSize;
                g.sleeveCount = sCnt;
            });
            persistData();
            renderFilteredGames();
            $('#bulk-editor-modal').classList.add('hidden');
            showMessage('모든 변경사항이 일괄 저장되었습니다.', 'success');
        }

        function parsePrice(g) {
            const raw = (g.customFields && g.customFields['구매가격']) ?? g.purchasePrice ?? 0;
            return parseInt(String(raw).replace(/[^0-9]/g, ''), 10) || 0;
        }
        function parseDateYMD(g) {
            const raw = (g.customFields && g.customFields['구매일자']) || g.purchaseDate || '';
            return String(raw).trim().slice(0, 10);
        }

        /* =========================================================
           6. 필터링 및 그리드/리스트 렌더링
           ========================================================= */
        function initFilterListeners() {
            const debouncedRender = () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(renderFilteredGames, 200);
            };
            const savedHideExp = localStorage.getItem('hideExpansions');
            if (savedHideExp !== null) dom.hideExpansionsToggle.checked = savedHideExp === 'true';

            [dom.playerCountInput, dom.bestPlayerToggle, dom.difficultyMin, dom.difficultyMax, dom.timeMin, dom.timeMax]
                .forEach(input => input.addEventListener('input', renderFilteredGames));

            dom.hideExpansionsToggle.addEventListener('input', () => {
                localStorage.setItem('hideExpansions', dom.hideExpansionsToggle.checked);
                renderFilteredGames();
            });
            [dom.nameSearchInput, dom.genreSearchInput].forEach(input => input.addEventListener('input', debouncedRender));
            dom.tagFilterContainer.addEventListener('change', renderFilteredGames);
            dom.sortBtn.addEventListener('click', cycleSort);
            dom.randomPickBtn.addEventListener('click', randomPickGame);

            initRangeSlider(dom.difficultyMin, dom.difficultyMax, dom.difficultyRange, dom.difficultyMinValue, dom.difficultyMaxValue, 1, 5, 0.1, v => v.toFixed(1));
            initRangeSlider(dom.timeMin, dom.timeMax, dom.timeRange, dom.timeMinValue, dom.timeMaxValue, 0, 240, 10, v => v >= 240 ? "240분+" : `${v}분`);
            dom.openGlobalTagManagerBtn.addEventListener('click', openGlobalTagManager);
            $('#open-bulk-editor-btn').onclick = openBulkEditorModal;
            $('#bulk-save-btn').onclick = saveBulkEditorChanges;
            $('#bulk-editor-modal').querySelector('.modal-close-btn').onclick = () => $('#bulk-editor-modal').classList.add('hidden');
        }

        function initRangeSlider(minInput, maxInput, rangeEl, minValEl, maxValEl, min, max, step, formatCallback) {
            const update = () => {
                let minVal = parseFloat(minInput.value), maxVal = parseFloat(maxInput.value);
                if (minVal > maxVal) [minVal, maxVal] = [maxVal, minVal];
                const minPct = ((minVal - min) / (max - min)) * 100, maxPct = ((maxVal - min) / (max - min)) * 100;
                rangeEl.style.left = `${minPct}%`;
                rangeEl.style.width = `${maxPct - minPct}%`;
                minValEl.textContent = formatCallback(minVal);
                maxValEl.textContent = formatCallback(maxVal);
            };
            minInput.addEventListener('input', update);
            maxInput.addEventListener('input', update);
            update();
        }

        function renderTagFilters() {
            dom.tagFilterContainer.innerHTML = '';
            if (allUserTags.length === 0) {
                dom.tagFilterContainer.innerHTML = '<p class="filter-no-tags-info">태그를 생성/관리하려면 + 버튼을 누르세요.</p>';
                return;
            }
            allUserTags.forEach(tag => {
                const tagEl = document.createElement('div');
                tagEl.className = 'tag-filter-item';
                tagEl.innerHTML = `
                    <input type="checkbox" id="tag-${tag.id}" data-tag-id="${tag.id}">
                    <label for="tag-${tag.id}">
                        <span class="tag-color-dot" style="background-color: ${tag.color};"></span>
                        ${escapeHtmlSafe(tag.name)}
                    </label>`;
                dom.tagFilterContainer.appendChild(tagEl);
            });
        }

        function getCurrentFilters() {
            return {
                name: dom.nameSearchInput.value.toLowerCase(),
                genre: dom.genreSearchInput.value.toLowerCase(),
                players: parseInt(dom.playerCountInput.value, 10) || 0,
                bestOnly: dom.bestPlayerToggle.checked,
                hideExpansions: dom.hideExpansionsToggle.checked,
                tags: Array.from(dom.tagFilterContainer.querySelectorAll('input:checked')).map(el => el.dataset.tagId),
                diffMin: parseFloat(dom.difficultyMin.value),
                diffMax: parseFloat(dom.difficultyMax.value),
                timeMin: parseInt(dom.timeMin.value, 10),
                timeMax: parseInt(dom.timeMax.value, 10)
            };
        }

        function applyFiltersToGames(games) {
            const filters = getCurrentFilters();
            return games.filter(game => {
                const customName = game.customFields && game.customFields['게임 이름'];
                const gameName = customName || game.name || '';
                if (filters.name && !gameName.toLowerCase().includes(filters.name)) return false;

                if (filters.hideExpansions) {
                    const categories = game.categories || [];
                    const themes = game.themes || [];
                    const customGenre = (game.customFields && game.customFields['장르']) || '';
                    const isExpChecked = game.customFields && (game.customFields['확장판'] === 'true' || game.customFields['확장판'] === 'O');
                    const isExp = isExpChecked || categories.some(c => c.toLowerCase().includes('expansion') || c.includes('확장')) ||
                        themes.some(t => t.includes('본판이 필요한 확장')) || customGenre.includes('확장');
                    if (isExp) return false;
                }

                if (filters.genre) {
                    const searchIn = [...(game.categories || []), ...(game.themes || []), ...(game.mechanics || []), (game.customFields && game.customFields['장르']) || ''].join(' ').toLowerCase();
                    if (!searchIn.includes(filters.genre)) return false;
                }

                if (filters.players > 0) {
                    const minP = parseInt(game.minplayers, 10), maxP = parseInt(game.maxplayers, 10);
                    if (!isNaN(minP) && filters.players < minP) return false;
                    if (!isNaN(maxP) && maxP > 0 && filters.players > maxP) return false;
                    if (filters.bestOnly) {
                        if (!game.bestplayercounts || game.bestplayercounts.length === 0) return false;
                        const matchBest = (bc, n) => {
                            const s = String(bc).trim();
                            if (s.endsWith('+')) return n >= parseInt(s.slice(0, -1), 10);
                            if (s.includes('-') || s.includes('~')) {
                                const [a, b] = s.split(/[-~]/).map(x => parseInt(x.trim(), 10));
                                return n >= a && n <= b;
                            }
                            return parseInt(s, 10) === n;
                        };
                        if (!game.bestplayercounts.some(bc => matchBest(bc, filters.players))) return false;
                    }
                }

                const compVal = parseFloat(game.complexity);
                if ((filters.diffMin > 1 || filters.diffMax < 5) && !isNaN(compVal) && compVal > 0) {
                    if (compVal < filters.diffMin || compVal > filters.diffMax) return false;
                }

                const gMinT = parseInt(game.minplaytime, 10), gMaxT = parseInt(game.maxplaytime, 10);
                const fMaxT = filters.timeMax >= 240 ? Infinity : filters.timeMax;
                if ((filters.timeMin > 0 || filters.timeMax < 240) && !isNaN(gMinT) && !isNaN(gMaxT) && (gMinT > 0 || gMaxT > 0)) {
                    if (gMaxT < filters.timeMin || gMinT > fMaxT) return false;
                }

                if (filters.tags.length > 0) {
                    const gTags = game.tags || [];
                    if (!filters.tags.every(tid => gTags.includes(tid))) return false;
                }
                return true;
            });
        }

        function cycleSort() {
            const sortCycle = { 'name-asc': 'name-desc', 'name-desc': 'difficulty-asc', 'difficulty-asc': 'difficulty-desc', 'difficulty-desc': 'recent-desc', 'recent-desc': 'name-asc' };
            const sortText = { 'name-asc': '정렬: 가나다순', 'name-desc': '정렬: 가나다역순', 'difficulty-asc': '정렬: 난이도 오름차순', 'difficulty-desc': '정렬: 난이도 내림차순', 'recent-desc': '정렬: 최근 추가된 순' };
            currentSort = sortCycle[currentSort];
            dom.sortBtn.textContent = sortText[currentSort];
            renderFilteredGames();
        }

        function sortGames(games) {
            games.sort((a, b) => {
                const nameA = (a.customFields && a.customFields['게임 이름']) || a.name || '';
                const nameB = (b.customFields && b.customFields['게임 이름']) || b.name || '';
                switch (currentSort) {
                    case 'name-asc': return nameA.localeCompare(nameB, 'ko');
                    case 'name-desc': return nameB.localeCompare(nameA, 'ko');
                    case 'difficulty-asc': return (parseFloat(a.complexity) || 0) - (parseFloat(b.complexity) || 0);
                    case 'difficulty-desc': return (parseFloat(b.complexity) || 0) - (parseFloat(a.complexity) || 0);
                    case 'recent-desc': return (b.createdAt || 0) - (a.createdAt || 0);
                    default: return 0;
                }
            });
        }

        function renderFilteredGames() {
            const filtered = applyFiltersToGames(allUserGames);
            sortGames(filtered);
            const container = dom.gameListContainer;
            container.innerHTML = '';
            dom.gameCountBadge.textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-state-text">해당하는 게임이 없습니다.</p>';
                container.className = 'game-grid';
                return;
            }
            container.className = currentViewMode === 'grid' ? 'game-grid' : 'game-list';
            filtered.forEach(game => renderGameCard(game, container));
        }

        function tagTextColor(hexColor) {
            if (!hexColor || typeof hexColor !== 'string') return '#ffffff';
            let h = hexColor.replace('#', '').trim();
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            if (h.length !== 6) return '#ffffff';
            const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
            return ((0.299 * r + 0.587 * g + 0.114 * b) / 255) > 0.6 ? '#1a1a1a' : '#ffffff';
        }

        function formatPlayersRange(game) {
            const minP = parseInt(game.minplayers, 10), maxP = parseInt(game.maxplayers, 10);
            if (!isNaN(minP) && !isNaN(maxP) && maxP > 0) return minP === maxP ? `${minP}명` : `${minP}–${maxP}명`;
            return !isNaN(minP) && minP > 0 ? `${minP}명` : '';
        }

        function formatTimeRange(game) {
            const minT = parseInt(game.minplaytime, 10), maxT = parseInt(game.maxplaytime, 10);
            if (!isNaN(minT) && !isNaN(maxT) && maxT > 0) return minT === maxT ? `${minT}분` : `${minT}–${maxT}분`;
            return !isNaN(minT) && minT > 0 ? `${minT}분` : '';
        }

        function renderGameCard(game, container) {
            const item = document.createElement('div');
            const custom = game.customFields || {};
            const displayName = custom['게임 이름'] || game.name;
            const imageUrl = resolveCoverUrl(custom['대표 이미지'] || game.image || game.thumbnail) || 'https://placehold.co/300x300/6750A4/ffffff?text=' + encodeURIComponent(displayName);

            let tagsHtml = '';
            (game.tags || []).forEach(tagId => {
                const tag = allUserTags.find(t => t.id === tagId);
                if (tag) tagsHtml += `<span class="card-tag" style="background-color:${tag.color};color:${tagTextColor(tag.color)};">${escapeHtmlSafe(tag.name)}</span>`;
            });

            if (currentViewMode === 'grid') {
                item.className = 'game-card-grid';
                const subtitleTxt = [formatPlayersRange(game), formatTimeRange(game)].filter(Boolean).join(' · ');
                item.innerHTML = `
                    <div class="game-image">
                        <div class="card-tags-container">${tagsHtml}</div>
                        <img src="${imageUrl}" alt="${escapeHtmlSafe(displayName)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://placehold.co/300x300/6750A4/ffffff?text=BG'">
                    </div>
                    <div class="game-title-grid">
                        <h3>${escapeHtmlSafe(displayName)}</h3>
                        ${subtitleTxt ? `<div class="game-card-subtitle">${subtitleTxt}</div>` : ''}
                    </div>`;
            } else {
                item.className = 'game-list-item';
                const priceTxt = custom['구매가격'] ? `${Number(String(custom['구매가격']).replace(/[^0-9]/g, '')).toLocaleString()}원` : '-';
                item.innerHTML = `
                    <div class="list-item-header">
                        <div>
                            <h3>${escapeHtmlSafe(displayName)}</h3>
                            <div class="list-item-tags">${tagsHtml}</div>
                        </div>
                    </div>
                    <div class="list-item-details">
                        <div class="list-detail-item"><strong>플레이 인원</strong><span>${formatPlayersRange(game) || '-'}</span></div>
                        <div class="list-detail-item"><strong>베스트 인원</strong><span>${(game.bestplayercounts && game.bestplayercounts.join(', ')) || '-'}</span></div>
                        <div class="list-detail-item"><strong>플레이 시간</strong><span>${formatTimeRange(game) || '-'}</span></div>
                        <div class="list-detail-item"><strong>난이도</strong><span>${game.complexity || 0}/5</span></div>
                        <div class="list-detail-item"><strong>구매일자</strong><span>${parseDateYMD(game) || '-'}</span></div>
                        <div class="list-detail-item"><strong>구매가격</strong><span>${priceTxt}</span></div>
                        ${game.sleeveSize ? `<div class="list-detail-item"><strong>슬리브</strong><span>${game.sleeveSize} (${game.sleeveCount || 0}장)</span></div>` : ''}
                    </div>`;
            }
            item.addEventListener('click', () => openDetailModal(game.id));
            container.appendChild(item);
        }

           7. 상세 모달 ( [E-4] 오늘 플레이 기록 남기기 버튼 포함 )
           ========================================================= */

            dom.detailModal.classList.remove('hidden');
            const game = allUserGames.find(g => g.id === docId);
            if (!game) { dom.detailModal.classList.add('hidden'); return; }
            renderModalContent(game);
        }

                            <input type="number" id="modal-sleeve-count" class="filter-input" placeholder="매수" value="${game.sleeveCount || ''}" style="width:5.5rem;">

            dom.detailModal.innerHTML = `

                                <div class="detail-tab-panel" data-tab="memo">${memoTabHtml}</div>
                                <div class="detail-tab-panel" data-tab="play"><div class="play-tab-loading">불러오는 중…</div></div>
                            </div>
                        </div>
                        <div class="modal-footer" style="justify-content: flex-end; gap: 0.5rem;">
                            <button id="delete-game-btn" class="detail-section-icon-btn" style="color:var(--delete-color);" title="삭제">🗑️</button>
                            <button id="edit-mode-btn" class="detail-section-icon-btn edit-mode-btn" title="수정/저장">✏️</button>
                        </div>
                    </div>
                </div>`;

            const playPanel = dom.detailModal.querySelector('.detail-tab-panel[data-tab="play"]');
            if (playPanel) renderPlayTabForGame(game, playPanel);
        }

        function renderPlayTabForGame(game, panelEl) {
            const allRecs = JSON.parse(localStorage.getItem(SESSIONS_STORAGE_KEY) || '[]');
            const matchesGame = (g) => g.gameId === game.id || g.gameName === game.name;
            const matching = allRecs.filter(rec => (rec.games || rec.gameResults || []).some(matchesGame));

            if (matching.length === 0) {
                panelEl.innerHTML = `
                    <div class="play-tab-empty">
                        <div class="play-tab-empty-icon">🎲</div>
                        <div class="play-tab-empty-msg">아직 이 게임의 플레이 기록이 없어요.</div>
                    </div>
                    <a href="./sessions.html?sessionAddGame=1&gameId=${game.id}" class="play-tab-link-btn">📅 오늘 기록 남기러 가기</a>`;
                return;
            }

            const totalPlays = matching.reduce((sum, rec) => {
                const g = (rec.games || rec.gameResults || []).find(matchesGame);
                return sum + Math.max((g?.rounds || []).length, 1);
            }, 0);

            const cardsHtml = matching.map(rec => {
                const g = (rec.games || rec.gameResults || []).find(matchesGame);
                const plays = Math.max((g?.rounds || []).length, 1);
                const players = (rec.players || []).join(', ');
                return `
                    <div class="play-record-card">
                        <div class="play-record-card-header">
                            <span class="play-record-date">${escapeHtmlSafe(String(rec.date || ''))}</span>
                            <span class="play-record-plays">${plays}판</span>
                            ${rec.rating ? `<span class="play-record-rating">${'★'.repeat(rec.rating)}</span>` : ''}
                        </div>
                        ${players ? `<div class="play-record-players">👥 ${escapeHtmlSafe(players)}</div>` : ''}
                        ${rec.memo ? `<div class="play-record-memo">${escapeHtmlSafe(rec.memo)}</div>` : ''}
                    </div>`;
            }).join('');

            panelEl.innerHTML = `
                <div class="play-tab-stats">
                    <div class="play-tab-stat"><div class="play-tab-stat-value">${totalPlays}</div><div class="play-tab-stat-label">총 플레이</div></div>
                    <div class="play-tab-stat"><div class="play-tab-stat-value">${matching.length}</div><div class="play-tab-stat-label">기록</div></div>
                </div>
                <div class="play-record-list">${cardsHtml}</div>
                <a href="./sessions.html" class="play-tab-link-btn" style="margin-top:0.75rem;">📅 전체 게임 기록 보기</a>`;
        }

        function saveModalData(docId, modalContentEl) {
            const game = allUserGames.find(g => g.id === docId);
            if (!game) return;
            const newCustom = { ...(game.customFields || {}) };

            modalContentEl.querySelectorAll('.sync-input[type="checkbox"]').forEach(el => {
                const k = el.dataset.customKey;
                if (k) newCustom[k] = el.checked ? 'O' : '';
            });
            modalContentEl.querySelectorAll('.sync-input:not([type="checkbox"])').forEach(el => {
                const k = el.dataset.customKey;
                if (k) newCustom[k] = el.value.trim();
            });

            if (newCustom['대표 이미지']) {
                newCustom['대표 이미지'] = resolveCoverUrl(newCustom['대표 이미지']);
                game.image = newCustom['대표 이미지'];
            }

            const sSizeEl = modalContentEl.querySelector('#modal-sleeve-size');
            const sCntEl = modalContentEl.querySelector('#modal-sleeve-count');
            if (sSizeEl) game.sleeveSize = sSizeEl.value.trim();
            if (sCntEl) game.sleeveCount = parseInt(sCntEl.value, 10) || 0;

            const memoArea = modalContentEl.querySelector('#memo-textarea');
            const pubToggle = modalContentEl.querySelector('#memo-public-toggle');
            if (memoArea) game.memo = memoArea.value;
            if (pubToggle) game.memoPublic = pubToggle.checked;

            const editMinP = modalContentEl.querySelector('#edit-minp');
            if (editMinP) {
                game.minplayers = editMinP.value;
                game.maxplayers = modalContentEl.querySelector('#edit-maxp')?.value || editMinP.value;
                game.minplaytime = modalContentEl.querySelector('#edit-mint')?.value || '0';
                game.maxplaytime = modalContentEl.querySelector('#edit-maxt')?.value || '0';
                game.complexity = modalContentEl.querySelector('#edit-diff')?.value || '0';
            }

            game.customFields = newCustom;
            persistData();
            renderFilteredGames();
        }

        function initModalListeners() {
            dom.detailModal.addEventListener('click', async (e) => {
                const modalContentEl = e.target.closest('.detail-content');
                if (!modalContentEl) return;
                const docId = modalContentEl.dataset.docId;
                const game = allUserGames.find(g => g.id === docId);
                if (!game) return;

                if (e.target.matches('.modal-close-btn')) {
                    saveModalData(docId, modalContentEl);
                    dom.detailModal.classList.add('hidden');
                } else if (e.target.matches('#edit-mode-btn') || e.target.closest('#edit-mode-btn')) {
                    const btn = modalContentEl.querySelector('#edit-mode-btn');
                    if (btn.dataset.mode === 'editing') {
                        saveModalData(docId, modalContentEl);
                        btn.dataset.mode = '';
                        btn.textContent = '✏️';
                        btn.classList.remove('saving');
                        renderModalContent(allUserGames.find(g => g.id === docId));
                        showMessage('변경사항이 저장되었습니다.', 'success');
                    } else {
                        btn.dataset.mode = 'editing';
                        btn.textContent = '💾';
                        btn.classList.add('saving');
                        const statsGrid = modalContentEl.querySelector('.quick-stats-grid');
                        if (statsGrid) {
                            statsGrid.innerHTML = `
                                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value" style="display:flex; justify-content:center; align-items:center;">
                                    <input type="number" id="edit-minp" value="${game.minplayers || 1}" style="width:2.5ch; background:transparent; border:none; border-bottom:1px solid var(--md-primary); color:inherit; text-align:center;">-<input type="number" id="edit-maxp" value="${game.maxplayers || 4}" style="width:2.5ch; background:transparent; border:none; border-bottom:1px solid var(--md-primary); color:inherit; text-align:center;">명
                                </div></div>
                                <div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-value" style="display:flex; justify-content:center; align-items:center;">
                                    <input type="number" id="edit-mint" value="${game.minplaytime || 30}" style="width:3.5ch; background:transparent; border:none; border-bottom:1px solid var(--md-primary); color:inherit; text-align:center;">-<input type="number" id="edit-maxt" value="${game.maxplaytime || 60}" style="width:3.5ch; background:transparent; border:none; border-bottom:1px solid var(--md-primary); color:inherit; text-align:center;">분
                                </div></div>
                                <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-value" style="display:flex; justify-content:center; align-items:center;">
                                    <input type="number" step="0.1" id="edit-diff" value="${game.complexity || 2.5}" style="width:3ch; background:transparent; border:none; border-bottom:1px solid var(--md-primary); color:inherit; text-align:center;">/ 5
                                </div></div>`;
                        }
                    }
                } else if (e.target.matches('#delete-game-btn') || e.target.closest('#delete-game-btn')) {
                    if (confirm(`'${game.name}' 게임을 책장에서 삭제할까요?`)) {
                        allUserGames = allUserGames.filter(g => g.id !== docId);
                        persistData();
                        renderFilteredGames();
                        dom.detailModal.classList.add('hidden');
                        showMessage('게임이 삭제되었습니다.', 'success');
                    }
                } else if (e.target.matches('#manage-tags-btn') || e.target.closest('#manage-tags-btn')) {
                    openTagApplyModal(docId, game.tags || []);
                } else if (e.target.matches('#my-rating-btn') || e.target.closest('#my-rating-btn')) {
                    openRatingModal(docId, game.myRating || null);
                } else if (e.target.matches('#image-manage-icon-btn') || e.target.closest('#image-manage-icon-btn')) {
                    try {
                        const hit = await findBestGameInDb(game.name);
                        if (hit && hit.image) {
                            game.image = hit.image;
                            if (!game.customFields) game.customFields = {};
                            game.customFields['대표 이미지'] = hit.image;
                            persistData();
                            renderFilteredGames();
                            renderModalContent(game);
                            showMessage(`✅ '${hit.name}' 커버 이미지로 업데이트되었습니다!`, 'success');
                            return;
                        }
                    } catch (err) {}
                    const newUrl = prompt('새 커버 이미지 URL 또는 보드라이프 번호(예: 14527):', (game.customFields && game.customFields['대표 이미지']) || game.image || '');
                    if (newUrl !== null && newUrl.trim() !== '') {
                        const resolved = resolveCoverUrl(newUrl.trim());
                        game.image = resolved;
                        if (!game.customFields) game.customFields = {};
                        game.customFields['대표 이미지'] = resolved;
                        persistData();
                        renderFilteredGames();
                        renderModalContent(game);
                    }
                } else if (e.target.matches('.detail-tab-btn')) {
                    const targetTab = e.target.dataset.tab;
                    modalContentEl.querySelectorAll('.detail-tab-btn').forEach(b => b.classList.toggle('active', b === e.target));
                    modalContentEl.querySelectorAll('.detail-tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === targetTab));
                }
            });
        }

        /* =========================================================
           8. 추가 모달 및 실시간 토큰 설정
           ========================================================= */
        function initAddGameModals() {
            dom.addGameButton.onclick = () => {
                dom.searchPanel.classList.remove('hidden');
                updateRtStatusUI();
                const inputEl = $('#bl-db-search-input');
                if (inputEl) { inputEl.value = ''; $('#bl-db-search-results').innerHTML = ''; setTimeout(() => inputEl.focus(), 50); }
            };
            dom.searchPanel.querySelector('.modal-close-btn').onclick = () => dom.searchPanel.classList.add('hidden');

            $('#set-rt-token-btn').onclick = () => {
                const cur = localStorage.getItem(FB_REFRESH_TOKEN_KEY) || '';
                const input = prompt('mybgshelf.web.app 콘솔에서 추출한 실시간 검색 키(refreshToken)를 붙여넣으세요:', cur);
                if (input !== null) {
                    localStorage.setItem(FB_REFRESH_TOKEN_KEY, input.trim());
                    _cachedIdToken = null;
                    _cachedIdTokenExp = 0;
                    updateRtStatusUI();
                    showMessage('✅ 실시간 DB 연동 키가 저장되었습니다.', 'success');
                }
            };

            const blDbInput = $('#bl-db-search-input');
            if (blDbInput) {
                blDbInput.addEventListener('input', () => {
                    clearTimeout(boardLifeSearchDebounceTimer);
                    boardLifeSearchDebounceTimer = setTimeout(async () => {
                        const q = blDbInput.value.trim();
                        const resBox = $('#bl-db-search-results');
                        if (!q) { resBox.innerHTML = ''; return; }
                        resBox.innerHTML = '<div class="spinner" style="margin: 1rem auto;"></div>';
                        try {
                            const { docs } = await searchRealtimeBoardLifeDB(q, 30);
                            if (docs.length === 0) {
                                resBox.innerHTML = '<p style="text-align:center; color:var(--text-light); padding:1rem;">검색 결과가 없습니다.</p>';
                                return;
                            }
                            resBox.innerHTML = '';
                            docs.forEach(g => {
                                const dbNumId = getBlNumId(g);
                                const isAdded = (dbNumId && allUserGames.some(ug => getBlNumId(ug) === dbNumId)) || allUserGames.some(ug => ug.id === g.id);
                                const item = document.createElement('div');
                                item.className = 'search-result-item';
                                item.style.cssText = 'display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center;';
                                const thumbUrl = g.image || g.thumbnail || './placeholder.png';
                                item.innerHTML = `
                                    <img src="${thumbUrl}" alt="${escapeHtmlSafe(g.name)}" referrerpolicy="no-referrer" style="width:40px; height:40px; object-fit:cover; border-radius:4px; border:1px solid var(--border-color);">
                                    <div style="display:flex; flex-direction:column; overflow:hidden;">
                                        <span class="name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtmlSafe(g.name)}</span>
                                        <span class="year" style="font-size:0.8em; color:var(--text-secondary);">${g.yearPublished || ''}</span>
                                    </div>
                                    <button class="add-btn" ${isAdded ? 'disabled' : ''}>${isAdded ? '추가됨' : '추가'}</button>`;
                                if (!isAdded) {
                                    item.querySelector('.add-btn').onclick = (e) => {
                                        e.target.disabled = true;
                                        handleAddBoardLifeDBGame(g, e.target);
                                    };
                                }
                                resBox.appendChild(item);
                            });
                        } catch (e) {
                            resBox.innerHTML = '<div style="text-align:center; padding:1rem; color:var(--error-color);">실시간 검색 키(refreshToken)를 상단 버튼에서 설정해주세요.</div>';
                        }
                    }, 150);
                });
            }

            $('#quick-json-import').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (parsed.firebaseRefreshToken) localStorage.setItem(FB_REFRESH_TOKEN_KEY, parsed.firebaseRefreshToken);
                        const gArr = Array.isArray(parsed) ? parsed : (parsed.games || []);
                        allUserGames = gArr.map(normalizeGameRecord);
                        if (parsed.tags) allUserTags = parsed.tags;
                        if (parsed.sessions) localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(parsed.sessions));
                        if (parsed.players) localStorage.setItem(PLAYERS_STORAGE_KEY, JSON.stringify(parsed.players));
                        persistData();
                        updateRtStatusUI();
                        renderTagFilters();
                        renderFilteredGames();
                        dom.searchPanel.classList.add('hidden');
                        showMessage(`🎉 총 ${allUserGames.length}개 게임 복원 완료!`, 'success');
                    } catch (err) { showMessage('올바른 JSON 파일이 아닙니다.', 'error'); }
                };
                reader.readAsText(file);
            });

            dom.openManualAddBtn.onclick = () => {
                dom.searchPanel.classList.add('hidden');
                $('#manual-purchase-date').value = new Date().toISOString().slice(0, 10);
                dom.manualAddPanel.classList.remove('hidden');
            };
            dom.manualAddPanel.querySelector('.modal-close-btn').onclick = () => dom.manualAddPanel.classList.add('hidden');

            $('#manual-match-btn').onclick = async () => {
                const name = $('#manual-name').value.trim();
                if (!name) return;
                const hit = await findBestGameInDb(name);
                if (hit) {
                    $('#manual-image-url').value = hit.image || '';
                    $('#manual-minplayers').value = hit.minplayers || '1';
                    $('#manual-maxplayers').value = hit.maxplayers || '4';
                    $('#manual-minplaytime').value = hit.minplaytime || '30';
                    $('#manual-maxplaytime').value = hit.maxplaytime || '60';
                    $('#manual-complexity').value = hit.complexity || '2.5';
                    showMessage(`✅ '${hit.name}' 매칭 완료!`, 'success');
                } else {
                    showMessage('일치하는 게임이 없습니다.', 'error');
                }
            };

            dom.manualAddForm.onsubmit = async (e) => {
                e.preventDefault();
                const name = $('#manual-name').value.trim();
                if (!name) return;
                let imgUrl = resolveCoverUrl($('#manual-image-url').value.trim());
                if (!imgUrl) {
                    const hit = await findBestGameInDb(name);
                    if (hit && hit.image) imgUrl = hit.image;
                }
                const newGame = normalizeGameRecord({
                    id: `manual_${Date.now()}`,
                    name,
                    image: imgUrl,
                    minplayers: $('#manual-minplayers').value || '1',
                    maxplayers: $('#manual-maxplayers').value || '4',
                    minplaytime: $('#manual-minplaytime').value || '30',
                    maxplaytime: $('#manual-maxplaytime').value || '60',
                    complexity: $('#manual-complexity').value || '2.5',
                    isManual: true,
                    createdAt: Date.now(),
                    customFields: {
                        '구매일자': $('#manual-purchase-date').value || '',
                        '구매가격': $('#manual-purchase-price').value || '',
                        '대표 이미지': imgUrl
                    }
                });
                allUserGames.unshift(newGame);
                persistData();
                renderFilteredGames();
                dom.manualAddForm.reset();
                dom.manualAddPanel.classList.add('hidden');
                showMessage(`${name} 추가 완료!`, 'success');
            };

            dom.openBoardlifeAddBtn.onclick = () => {
                dom.searchPanel.classList.add('hidden');
                dom.boardlifeAddPanel.classList.remove('hidden');
            };
            dom.boardlifeAddPanel.querySelector('.modal-close-btn').onclick = () => dom.boardlifeAddPanel.classList.add('hidden');
        }

        function openGlobalTagManager() {
            const modalEl = document.createElement('div');
            modalEl.className = 'modal tag-manage-modal';
            const render = () => {
                const listHtml = allUserTags.map(tag => `
                    <div class="tag-manage-item" data-tag-id="${tag.id}">
                        <div class="tag-manage-item-info">
                            <span class="tag-color-dot" style="background-color:${tag.color};"></span>
                            <span>${escapeHtmlSafe(tag.name)}</span>
                        </div>
                        <button class="tag-delete-btn" data-tag-id="${tag.id}">&times;</button>
                    </div>`).join('');
                modalEl.innerHTML = `
                    <div class="search-panel-content">
                        <button class="modal-close-btn">&times;</button>
                        <h2>전체 태그 관리</h2>
                        <div class="tag-manage-list">${listHtml || '<p>생성된 태그가 없습니다.</p>'}</div>
                        <div class="tag-create-form">
                            <input type="text" id="new-tag-name" class="filter-input" placeholder="새 태그 이름 (3자 이하)" maxlength="3">
                            <input type="color" id="new-tag-color" value="#6750A4" style="width:42px; height:42px; border:none; cursor:pointer;">
                            <button id="create-tag-btn" class="detail-section-btn">생성</button>
                        </div>
                    </div>`;
                modalEl.querySelector('.modal-close-btn').onclick = () => modalEl.remove();
                modalEl.querySelectorAll('.tag-delete-btn').forEach(btn => {
                    btn.onclick = () => {
                        const tid = btn.dataset.tagId;
                        allUserTags = allUserTags.filter(t => t.id !== tid);
                        allUserGames.forEach(g => g.tags = (g.tags || []).filter(id => id !== tid));
                        persistData();
                        renderTagFilters();
                        renderFilteredGames();
                        render();
                    };
                });
                modalEl.querySelector('#create-tag-btn').onclick = () => {
                    const name = modalEl.querySelector('#new-tag-name').value.trim();
                    const color = modalEl.querySelector('#new-tag-color').value;
                    if (!name) return;
                    allUserTags.push({ id: `t_${Date.now()}`, name, color });
                    persistData();
                    renderTagFilters();
                    render();
                };
            };
            render();
            document.body.appendChild(modalEl);
        }

        function initMobileSidebar() {
            dom.openFilterBtn.onclick = () => { dom.filterSidebar.classList.add('open'); dom.filterOverlay.classList.remove('hidden'); };
            const close = () => { dom.filterSidebar.classList.remove('open'); dom.filterOverlay.classList.add('hidden'); };
            dom.closeFilterBtn.onclick = close;
            dom.filterOverlay.onclick = close;
        }

        function initViewToggle() {
            const updateIcon = () => {
                const g = dom.viewToggleButton.querySelector('.grid-icon'), l = dom.viewToggleButton.querySelector('.list-icon');
                if (currentViewMode === 'grid') { g.classList.add('hidden'); l.classList.remove('hidden'); l.classList.add('active'); }
                else { l.classList.add('hidden'); g.classList.remove('hidden'); g.classList.add('active'); }
            };
            updateIcon();
            dom.viewToggleButton.onclick = () => {
                currentViewMode = currentViewMode === 'grid' ? 'list' : 'grid';
                updateIcon();
                renderFilteredGames();
            };
        }

        function initMobileAppLikeUI() {
            if (dom.mobileSearchInput && dom.nameSearchInput) {
                dom.mobileSearchInput.addEventListener('input', () => {
                    dom.nameSearchInput.value = dom.mobileSearchInput.value;
                    dom.nameSearchInput.dispatchEvent(new Event('input'));
                });
            }
            if (dom.playerChipsRow && dom.playerCountInput) {
                dom.playerChipsRow.addEventListener('click', (e) => {
                    const chip = e.target.closest('.player-chip');
                    if (!chip) return;
                    const val = chip.dataset.players;
                    dom.playerChipsRow.querySelectorAll('.player-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    dom.playerCountInput.value = val === '0' ? '' : val;
                    renderFilteredGames();
                });
            }
            if (dom.fabAddGame && dom.addGameButton) {
                dom.fabAddGame.onclick = () => dom.addGameButton.click();
            }
        }

        function randomPickGame() {
            const filtered = applyFiltersToGames(allUserGames);
            if (filtered.length === 0) { showMessage('조건에 맞는 게임이 없습니다.', 'error'); return; }
            const picked = filtered[Math.floor(Math.random() * filtered.length)];
            showMessage(`🎲 제비뽑기 결과: ${picked.name}`, 'success');
            setTimeout(() => openDetailModal(picked.id), 400);
        }

        function escapeHtmlSafe(str) {
            if (str == null) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function showMessage(message, type = 'success') {
            const el = document.createElement('div');
            el.className = `message ${type}`;
            el.textContent = message;
            dom.messageContainer.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    </script>
</body>
</html>
