<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>마이페이지 - 나의 보드게임 책장</title>
    <link rel="stylesheet" href="style.css?v=19">
    <meta name="theme-color" content="#F7F2FA">
    <style>
        .mp-custom-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 1.25rem; box-shadow: 0 0.125rem 0.5rem var(--shadow-color); margin-top: 1.5rem; }
        .mp-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .mp-panel-head h3 { font-size: 1rem; font-weight: 700; margin: 0; }
        .mp-bar-grid { display: flex; align-items: flex-end; gap: 0.65rem; height: 180px; padding-top: 2rem; border-bottom: 2px solid var(--border-color); overflow-x: auto; }
        .mp-bar-col { flex: 1; min-width: 50px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        .mp-bar-val { font-size: 0.68rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; text-align: center; white-space: nowrap; }
        .mp-bar-fill { width: 100%; max-width: 40px; background: var(--md-primary); border-radius: 6px 6px 0 0; min-height: 4px; }
        .mp-bar-labels { display: flex; gap: 0.65rem; margin-top: 0.4rem; }
        .mp-bar-label { flex: 1; min-width: 50px; text-align: center; font-size: 0.72rem; color: var(--text-secondary); font-weight: 600; }
        .cpp-table-wrap { width: 100%; overflow-x: auto; }
        .cpp-table { width: 100%; border-collapse: collapse; min-width: 540px; font-size: 0.85rem; }
        .cpp-table th, .cpp-table td { padding: 0.65rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        .cpp-table th { color: var(--text-secondary); font-size: 0.75rem; background: var(--bg-secondary); }
        .cpp-badge { padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="mypage-fullscreen-layout">
        <header class="mypage-header">
            <a href="./" class="action-icon-btn" title="책장으로 돌아가기">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h1>마이페이지</h1>
            <button id="dark-mode-toggle" class="action-icon-btn" title="다크모드 전환">🌓</button>
        </header>

        <nav class="mypage-tabs">
            <button class="tab-btn active" data-tab="statistics">구매 통계 &amp; 슬리브</button>
            <button class="tab-btn" data-tab="playstats">플레이 통계</button>
            <button class="tab-btn" data-tab="profile">프로필 &amp; 동기화</button>
        </nav>

        <main class="mypage-content">
            <div id="statistics-tab" class="tab-content active">
                <div class="tab-inner">
                    <h2 style="margin-bottom: 1.5rem;">구매 금액 및 슬리브 대시보드</h2>

                    <div class="stats-cards" style="grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));">
                        <div class="stat-card">
                            <h3>전체 구매 총액</h3>
                            <p class="stat-value" id="total-spent">0원</p>
                            <p class="stat-count" id="total-count">0개</p>
                        </div>
                        <div class="stat-card">
                            <h3>최근 (<input type="number" id="custom-days" min="1" value="30" style="width: 3.8rem; text-align: center; border: 1px solid var(--border-color); border-radius: 0.25rem; padding: 0.2rem; font-weight:700;">)일간 구매 총액</h3>
                            <p class="stat-value" id="custom-period-total">0원</p>
                            <p class="stat-count" id="custom-period-count">0개</p>
                        </div>
                        <div class="stat-card">
                            <h3>최근 1개월간 구매 총액</h3>
                            <p class="stat-value" id="one-month-total">0원</p>
                            <p class="stat-count" id="one-month-count">0개</p>
                        </div>
                        <div class="stat-card">
                            <h3>미슬리브 필요 매수 ([M-2])</h3>
                            <p class="stat-value" id="sleeve-needed-val" style="color:var(--md-tertiary);">0장</p>
                            <p class="stat-count" id="sleeve-needed-sub">미완료 게임 0개</p>
                        </div>
                    </div>

                    <!-- 월별 구매 금액 막대그래프 -->
                    <div class="mp-custom-panel">
                        <div class="mp-panel-head">
                            <h3>📊 월별 구매 금액 막대그래프</h3>
                            <select id="month-chart-mode" class="filter-input" style="width:auto; height:2.2rem; font-size:0.85rem;">
                                <option value="6">최근 6개월</option>
                                <option value="12">최근 12개월</option>
                                <option value="ACTIVE">구매 내역 있는 달만</option>
                            </select>
                        </div>
                        <div id="mp-bar-grid" class="mp-bar-grid"></div>
                        <div id="mp-bar-labels" class="mp-bar-labels"></div>
                    </div>

                    <!-- 가성비 순위 표 -->
                    <div class="mp-custom-panel">
                        <div class="mp-panel-head">
                            <h3>🏆 게임별 1회 플레이당 비용 (가성비 순위)</h3>
                            <select id="cpp-sort-select" class="filter-input" style="width:auto; height:2.2rem; font-size:0.85rem;">
                                <option value="cpp_asc">가성비 높은순 (1회당 비용 낮은순)</option>
                                <option value="cpp_desc">가성비 낮은순 (망부석·고비용순)</option>
                                <option value="price_desc">구매 가격 높은순</option>
                                <option value="plays_desc">플레이 횟수 많은순</option>
                            </select>
                        </div>
                        <div class="cpp-table-wrap">
                            <table class="cpp-table">
                                <thead>
                                    <tr>
                                        <th>순위</th>
                                        <th>게임 이름</th>
                                        <th>구매일자</th>
                                        <th>구매가격</th>
                                        <th>플레이</th>
                                        <th>1회당 비용</th>
                                        <th>등급</th>
                                    </tr>
                                </thead>
                                <tbody id="cpp-table-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <div style="margin-top: 2rem;">
                        <h3 style="margin-bottom: 1rem;">최근 구매한 게임</h3>
                        <div id="recent-purchases-list"></div>
                    </div>
                </div>
            </div>

            <div id="playstats-tab" class="tab-content">
                <div class="tab-inner">
                    <h2 style="margin-bottom: 1.5rem;">플레이 통계</h2>
                    <div class="stats-cards">
                        <div class="stat-card">
                            <h3>총 플레이</h3>
                            <p class="stat-value" id="total-plays">0</p>
                            <p class="stat-count" id="total-games-played">0개 게임</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="profile-tab" class="tab-content">
                <div class="tab-inner">
                    <div class="form-group">
                        <label for="nickname-input">닉네임</label>
                        <div class="input-group">
                            <input type="text" id="nickname-input" class="filter-input" placeholder="표시될 닉네임 입력">
                            <button id="save-nickname-btn" class="action-icon-btn">💾</button>
                        </div>
                    </div>
                    <div class="sync-section">
                        <h2 class="sync-section-title">☁️ JSON 백업 및 동기화</h2>
                        <div class="sync-panel">
                            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                                <label class="filter-sort-btn primary-action-btn" style="width:auto; cursor:pointer; display:inline-block;">
                                    📤 JSON 파일 불러오기
                                    <input type="file" id="import-json-input" accept=".json" style="display:none;">
                                </label>
                                <button id="export-json-btn" class="filter-sort-btn" style="width:auto;">📥 현재 데이터 JSON 백업</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const GAMES_STORAGE_KEY = "MY_BG_SHELF_DATA_V1";
        const SESSIONS_STORAGE_KEY = "MY_BG_SESSIONS_V1";
        const NICKNAME_KEY = "MY_BG_NICKNAME_V1";

        let games = [];
        let sessions = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            loadData();

            $('#custom-days').addEventListener('input', updateStats);
            $('#month-chart-mode').addEventListener('change', renderMonthlyBarChart);
            $('#cpp-sort-select').addEventListener('change', renderCppTable);

            $('#dark-mode-toggle').onclick = () => {
                const isDark = document.body.classList.toggle('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };

            document.querySelectorAll('.mypage-tabs .tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.mypage-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
                };
            });

            $('#nickname-input').value = localStorage.getItem(NICKNAME_KEY) || '나';
            $('#save-nickname-btn').onclick = () => {
                localStorage.setItem(NICKNAME_KEY, $('#nickname-input').value.trim() || '나');
                alert('저장되었습니다.');
            };

            $('#export-json-btn').onclick = () => {
                const blob = new Blob([JSON.stringify({ games, sessions }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `myboardgames_backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
            };

            $('#import-json-input').onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        const gArr = Array.isArray(parsed) ? parsed : (parsed.games || []);
                        localStorage.setItem(GAMES_STORAGE_KEY, JSON.stringify(gArr));
                        if (parsed.sessions) localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(parsed.sessions));
                        loadData();
                        alert(`총 ${gArr.length}개 게임을 복원했습니다!`);
                    } catch (err) { alert('올바른 파일이 아닙니다.'); }
                };
                reader.readAsText(file);
            };
        });

        function loadData() {
            games = JSON.parse(localStorage.getItem(GAMES_STORAGE_KEY) || '[]');
            sessions = JSON.parse(localStorage.getItem(SESSIONS_STORAGE_KEY) || '[]');
            updateStats();
        }

        function parsePrice(g) {
            const raw = (g.customFields && g.customFields['구매가격']) ?? g.purchasePrice ?? 0;
            return parseInt(String(raw).replace(/[^0-9]/g, ''), 10) || 0;
        }
        function parseDateYMD(g) {
            const raw = (g.customFields && g.customFields['구매일자']) || g.purchaseDate || '';
            return String(raw).trim().slice(0, 10);
        }
        function formatPrice(p) { return p.toLocaleString('ko-KR') + '원'; }
        function parseDate(s) {
            if (!s) return null;
            const d = new Date(String(s).trim());
            return isNaN(d.getTime()) ? null : d;
        }

        function updateStats() {
            const now = new Date();
            const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const customDays = parseInt($('#custom-days').value, 10) || 30;
            const customPeriodStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (customDays - 1));
            const oneMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());

            let totalSpent = 0, totalCount = 0;
            let customSpent = 0, customCount = 0;
            let oneMonthSpent = 0, oneMonthCount = 0;
            let unplayedSleeveCount = 0, unplayedSleeveGames = 0;
            const recentPurchases = [];

            games.forEach(g => {
                const price = parsePrice(g);
                const dStr = parseDateYMD(g);
                if (price > 0) { totalSpent += price; totalCount++; }

                // [M-2] 미슬리브 필요 매수 계산
                const isSleeveDone = g.customFields && (g.customFields['슬리브'] === 'O' || g.customFields['슬리브'] === 'true');
                if (!isSleeveDone) {
                    const cnt = parseInt(g.sleeveCount, 10) || 0;
                    if (cnt > 0) {
                        unplayedSleeveCount += cnt;
                        unplayedSleeveGames++;
                    }
                }

                if (dStr) {
                    const dt = parseDate(dStr);
                    if (dt) {
                        if (dt >= customPeriodStart) { customSpent += price; customCount++; }
                        if (dt >= oneMonthStart) { oneMonthSpent += price; oneMonthCount++; }
                        recentPurchases.push({ name: g.customFields?.['게임 이름'] || g.name, date: dt, price });
                    }
                }
            });

            $('#total-spent').textContent = formatPrice(totalSpent);
            $('#total-count').textContent = `${totalCount}개 게임`;
            $('#custom-period-total').textContent = formatPrice(customSpent);
            $('#custom-period-count').textContent = `${customCount}개`;
            $('#one-month-total').textContent = formatPrice(oneMonthSpent);
            $('#one-month-count').textContent = `${oneMonthCount}개`;

            $('#sleeve-needed-val').textContent = `${unplayedSleeveCount.toLocaleString()}장`;
            $('#sleeve-needed-sub').textContent = `미완료 게임 ${unplayedSleeveGames}개 책장 기준`;

            recentPurchases.sort((a, b) => b.date - a.date);
            $('#recent-purchases-list').innerHTML = recentPurchases.length === 0
                ? '<div class="empty-message">구매 기록이 없습니다.</div>'
                : recentPurchases.slice(0, 10).map(i => `
                    <div class="purchase-item">
                        <div>
                            <div class="purchase-item-name">${escapeHtmlSafe(i.name)}</div>
                            <div class="purchase-item-date">${i.date.toLocaleDateString('ko-KR')}</div>
                        </div>
                        <div class="purchase-item-price">${formatPrice(i.price)}</div>
                    </div>`).join('');

            renderMonthlyBarChart();
            renderCppTable();
        }

        function renderMonthlyBarChart() {
            const mode = $('#month-chart-mode').value;
            const monthMap = {};
            games.forEach(g => {
                const price = parsePrice(g);
                const d = parseDate(parseDateYMD(g));
                if (d && price > 0) {
                    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    if (!monthMap[ym]) monthMap[ym] = { amount: 0, count: 0 };
                    monthMap[ym].amount += price;
                    monthMap[ym].count += 1;
                }
            });

            let months = [];
            const now = new Date();
            if (mode === 'ACTIVE') {
                months = Object.keys(monthMap).sort();
                if (months.length === 0) months = [`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`];
            } else {
                const n = parseInt(mode, 10) || 6;
                for (let i = n - 1; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            }

            const maxVal = Math.max(...months.map(ym => monthMap[ym]?.amount || 0), 1);
            $('#mp-bar-grid').innerHTML = months.map(ym => {
                const info = monthMap[ym] || { amount: 0, count: 0 };
                const hPct = info.amount > 0 ? Math.max(Math.round((info.amount / maxVal) * 100), 6) : 2;
                return `
                    <div class="mp-bar-col">
                        <div class="mp-bar-val">${info.amount > 0 ? info.amount.toLocaleString() + '원' : '0원'}<br><small style="color:var(--text-secondary);">(${info.count}개)</small></div>
                        <div class="mp-bar-fill" style="height:${hPct}%; opacity:${info.amount > 0 ? 1 : 0.25};"></div>
                    </div>`;
            }).join('');

            $('#mp-bar-labels').innerHTML = months.map(ym => {
                const [y, m] = ym.split('-');
                return `<div class="mp-bar-label">${y.slice(2)}.${m}월</div>`;
            }).join('');
        }

        function getPlaysByGameMap() {
            const map = new Map();
            sessions.forEach(s => {
                (s.games || []).forEach(g => {
                    const cnt = Math.max((g.rounds || []).length, 1);
                    if (g.gameId) map.set(g.gameId, (map.get(g.gameId) || 0) + cnt);
                    if (g.gameName) map.set(g.gameName, (map.get(g.gameName) || 0) + cnt);
                });
            });
            return map;
        }

        function renderCppTable() {
            const sortBy = $('#cpp-sort-select').value;
            const playsMap = getPlaysByGameMap();

            const list = games.map(g => {
                const name = g.customFields?.['게임 이름'] || g.name;
                const price = parsePrice(g);
                const pDate = parseDateYMD(g) || '-';
                const plays = Math.max(Number(g.plays) || 0, playsMap.get(g.id) || 0, playsMap.get(name) || 0);
                const cpp = plays > 0 ? Math.round(price / plays) : Infinity;
                return { name, price, pDate, plays, cpp };
            });

            list.sort((a, b) => {
                if (sortBy === 'cpp_asc') return a.cpp !== b.cpp ? a.cpp - b.cpp : b.plays - a.plays;
                if (sortBy === 'cpp_desc') {
                    if (a.cpp === Infinity && b.cpp === Infinity) return b.price - a.price;
                    if (a.cpp === Infinity) return -1;
                    if (b.cpp === Infinity) return 1;
                    return b.cpp - a.cpp;
                }
                if (sortBy === 'price_desc') return b.price - a.price;
                if (sortBy === 'plays_desc') return b.plays - a.plays;
                return 0;
            });

            $('#cpp-table-body').innerHTML = list.map((g, i) => {
                const badge = g.plays <= 0
                    ? `<span class="cpp-badge" style="background:#f1f5f9;color:#475569;">🪨 망부석</span>`
                    : g.cpp <= 5000
                        ? `<span class="cpp-badge" style="background:#dcfce7;color:#166534;">👑 뽕 뽑음</span>`
                        : g.cpp <= 15000
                            ? `<span class="cpp-badge" style="background:#e0f2fe;color:#075985;">👍 갓성비</span>`
                            : `<span class="cpp-badge" style="background:#fef3c7;color:#92400e;">⏳ 분발 필요</span>`;
                return `
                    <tr>
                        <td><strong>${i + 1}</strong></td>
                        <td><strong>${escapeHtmlSafe(g.name)}</strong></td>
                        <td>${g.pDate}</td>
                        <td>${g.price.toLocaleString()}원</td>
                        <td>${g.plays}회</td>
                        <td>${g.plays > 0 ? `<strong style="color:var(--primary-color);">${g.cpp.toLocaleString()}원</strong>/회` : '<span style="color:var(--error-color);">미플레이</span>'}</td>
                        <td>${badge}</td>
                    </tr>`;
            }).join('') || '<tr><td colspan="7" style="text-align:center;">게임이 없습니다.</td></tr>';
        }

        function escapeHtmlSafe(str) {
            if (str == null) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }
    </script>
</body>
</html>
