<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>게임 기록 - 나의 보드게임 책장</title>
    <link rel="stylesheet" href="style.css?v=19">
    <style>
        .sessions-fullscreen-layout { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--bg-main); }
        .sessions-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .sessions-header h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .sessions-body { flex: 1; overflow-y: auto; padding: 1rem; }
        #sessions-list-view { display: flex; flex-direction: column; gap: 0.875rem; padding-bottom: 2rem; max-width: 34rem; margin: 0 auto; }
        #sessions-edit-view { display: none; max-width: 34rem; margin: 0 auto; }
        #sessions-edit-view.active { display: flex; flex-direction: column; gap: 1rem; }
        .edit-section { background: var(--bg-card); border-radius: 12px; padding: 1rem; border: 1px solid var(--border-color); }
        .edit-section-title { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.75rem; }
        .player-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
        .player-input-row { display: flex; gap: 0.5rem; }
        .small-btn { padding: 0.45rem 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
        .small-btn.primary { background: var(--md-primary); color: #fff; border-color: var(--md-primary); }
        .add-game-result-btn { width: 100%; padding: 0.65rem; border: 1.5px dashed var(--md-primary); border-radius: 10px; background: none; cursor: pointer; color: var(--md-primary); font-weight: 700; }
        .edit-actions { display: flex; gap: 0.75rem; padding: 1rem; background: var(--bg-card); border-top: 1px solid var(--border-color); }
        .edit-actions button { flex: 1; padding: 0.75rem; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; }
        .bottom-sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; }
        .bottom-sheet-overlay.open { display: block; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-radius: 16px 16px 0 0; max-height: 70vh; display: flex; flex-direction: column; z-index: 201; padding: 1rem; }
        .bottom-sheet-list { overflow-y: auto; flex: 1; margin-top: 0.5rem; }
        .bottom-sheet-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem; border-radius: 8px; cursor: pointer; }
        .bottom-sheet-item:hover { background: var(--bg-secondary); }
        .bottom-sheet-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="sessions-fullscreen-layout">
        <header class="sessions-header">
            <a href="./" class="action-icon-btn" title="책장으로 돌아가기">←</a>
            <h1 id="header-title">게임 기록</h1>
            <button id="add-session-btn" class="action-icon-btn" title="새 기록 추가">＋</button>
        </header>

        <div class="sessions-body">
            <div id="sessions-list-view">
                <div id="sessions-list-container"></div>
            </div>

            <div id="sessions-edit-view">
                <div class="edit-section">
                    <div class="edit-section-title">날짜</div>
                    <input type="date" id="session-date" class="filter-input">
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">참여자</div>
                    <div class="player-chips" id="player-chips"></div>
                    <div class="player-input-row">
                        <input type="text" id="player-name-input" class="filter-input" placeholder="이름 입력 후 추가">
                        <button class="small-btn" id="add-player-btn">추가</button>
                        <button class="small-btn" id="open-player-book-btn">주소록</button>
                    </div>
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">플레이한 게임</div>
                    <div id="game-result-cards" style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.75rem;"></div>
                    <button class="add-game-result-btn" id="add-game-result-btn">+ 내 책장에서 게임 선택</button>
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">평점 (1~5) &amp; 메모</div>
                    <input type="number" id="session-rating" class="filter-input" min="1" max="5" value="5" style="margin-bottom:0.5rem;">
                    <textarea id="session-memo" class="memo-box" placeholder="이 날의 승리자나 소감을 남겨보세요..." rows="3"></textarea>
                </div>
            </div>
        </div>

        <div class="edit-actions" id="edit-actions" style="display:none;">
            <button id="cancel-edit-btn" style="background:var(--bg-secondary); color:var(--text-primary);">취소</button>
            <button id="save-session-btn" style="background:var(--md-primary); color:#fff;">저장</button>
        </div>
    </div>

    <!-- 참여자 주소록 시트 -->
    <div class="bottom-sheet-overlay" id="player-book-overlay">
        <div class="bottom-sheet">
            <h3>저장된 참여자</h3>
            <div class="bottom-sheet-list" id="player-book-list"></div>
        </div>
    </div>

    <!-- 게임 선택 시트 -->
    <div class="bottom-sheet-overlay" id="game-picker-overlay">
        <div class="bottom-sheet">
            <h3>내 책장 게임 선택</h3>
            <input type="text" id="game-picker-search" class="filter-input" placeholder="게임 이름 검색..." style="margin-top:0.5rem;">
            <div class="bottom-sheet-list" id="game-picker-list"></div>
        </div>
    </div>

    <nav class="mobile-bottom-nav">
        <a href="./" class="nav-item"><span>책장</span></a>
        <a href="./sessions.html" class="nav-item active"><span>게임 기록</span></a>
        <a href="./mypage.html" class="nav-item"><span>마이페이지</span></a>
    </nav>

    <script>
        const GAMES_STORAGE_KEY = "MY_BG_SHELF_DATA_V1";
        const SESSIONS_STORAGE_KEY = "MY_BG_SESSIONS_V1";
        const PLAYERS_STORAGE_KEY = "MY_BG_PLAYERS_V1";

        let myGames = [];
        let allSessions = [];
        let allPlayers = [];
        let editPlayers = ['나'];
        let editGames = [];

        function loadAll() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            myGames = JSON.parse(localStorage.getItem(GAMES_STORAGE_KEY) || '[]');
            allSessions = JSON.parse(localStorage.getItem(SESSIONS_STORAGE_KEY) || '[]');
            allPlayers = JSON.parse(localStorage.getItem(PLAYERS_STORAGE_KEY) || '["나", "배우자", "아이", "모임원"]');
            renderSessions();
        }

        function renderSessions() {
            const box = document.getElementById('sessions-list-container');
            if (allSessions.length === 0) {
                box.innerHTML = '<div style="text-align:center; padding:4rem 1rem; color:var(--text-secondary);">아직 게임 기록이 없어요.<br><br><button class="small-btn primary" onclick="openEdit()">+ 첫 기록 남기기</button></div>';
                return;
            }
            box.innerHTML = allSessions.map(s => {
                const gList = s.games || [];
                const firstGame = gList[0] || {};
                const bgStyle = firstGame.gameThumbnail
                    ? `background-image:url('${firstGame.gameThumbnail}');`
                    : 'background:linear-gradient(135deg,#6750A4,#7D5260);';
                return `
                    <div class="session-card-v2" style="margin-bottom:1rem;">
                        <div class="session-card-header">
                            <div class="session-card-avatar">🎲</div>
                            <div class="session-card-header-info">
                                <span class="session-date">${s.date}</span>
                            </div>
                            <button class="small-btn" style="color:var(--error-color);" onclick="deleteSession('${s.id}')">삭제</button>
                        </div>
                        <div class="session-media" style="aspect-ratio:16/9;">
                            <div class="session-slide game-slide" style="${bgStyle} width:100%; height:100%;">
                                <div class="session-slide-overlay">
                                    <div class="session-slide-game-name">${gList.map(g => g.gameName || g).join(', ')}</div>
                                </div>
                            </div>
                        </div>
                        <div class="session-card-body">
                            ${(s.players && s.players.length) ? `<div class="session-info-row">👥 <span>${s.players.join(', ')}</span></div>` : ''}
                            ${s.memo ? `<p class="session-memo">${s.memo}</p>` : ''}
                            <div class="session-rating-row">
                                <span class="session-rating-label">오늘의 평점</span>
                                <span class="session-rating-stars">${'★'.repeat(s.rating || 5)}</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function openEdit() {
            document.getElementById('sessions-list-view').style.display = 'none';
            document.getElementById('sessions-edit-view').classList.add('active');
            document.getElementById('edit-actions').style.display = 'flex';
            document.getElementById('session-date').value = new Date().toISOString().slice(0, 10);
            editPlayers = ['나'];
            editGames = [];
            renderEditForm();
        }

        function closeEdit() {
            document.getElementById('sessions-edit-view').classList.remove('active');
            document.getElementById('edit-actions').style.display = 'none';
            document.getElementById('sessions-list-view').style.display = 'flex';
        }

        function renderEditForm() {
            document.getElementById('player-chips').innerHTML = editPlayers.map(p => `
                <span class="player-chip active">${p} <button type="button" style="border:none;background:none;color:#fff;margin-left:4px;cursor:pointer;" onclick="removePlayer('${p}')">×</button></span>
            `).join('');

            document.getElementById('game-result-cards').innerHTML = editGames.map((g, idx) => `
                <div style="display:flex; align-items:center; gap:0.6rem; padding:0.5rem; border:1px solid var(--border-color); border-radius:8px;">
                    <img src="${g.gameThumbnail || ''}" style="width:36px; height:36px; object-fit:cover; border-radius:6px;">
                    <strong style="flex:1;">${g.gameName}</strong>
                    <button type="button" class="small-btn" onclick="editGames.splice(${idx},1); renderEditForm();">제거</button>
                </div>
            `).join('');
        }

        function removePlayer(name) {
            editPlayers = editPlayers.filter(p => p !== name);
            renderEditForm();
        }

        function deleteSession(id) {
            if (!confirm('이 기록을 삭제할까요?')) return;
            allSessions = allSessions.filter(s => s.id !== id);
            localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(allSessions));
            renderSessions();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAll();
            document.getElementById('add-session-btn').onclick = openEdit;
            document.getElementById('cancel-edit-btn').onclick = closeEdit;

            document.getElementById('add-player-btn').onclick = () => {
                const val = document.getElementById('player-name-input').value.trim();
                if (!val) return;
                if (!editPlayers.includes(val)) editPlayers.push(val);
                if (!allPlayers.includes(val)) {
                    allPlayers.push(val);
                    localStorage.setItem(PLAYERS_STORAGE_KEY, JSON.stringify(allPlayers));
                }
                document.getElementById('player-name-input').value = '';
                renderEditForm();
            };

            document.getElementById('open-player-book-btn').onclick = () => {
                const overlay = document.getElementById('player-book-overlay');
                document.getElementById('player-book-list').innerHTML = allPlayers.map(p => `
                    <div class="bottom-sheet-item" onclick="if(!editPlayers.includes('${p}')) editPlayers.push('${p}'); renderEditForm(); document.getElementById('player-book-overlay').classList.remove('open');">👤 ${p}</div>
                `).join('');
                overlay.classList.add('open');
            };
            document.getElementById('player-book-overlay').onclick = (e) => {
                if (e.target.id === 'player-book-overlay') e.target.classList.remove('open');
            };

            const renderPicker = () => {
                const q = document.getElementById('game-picker-search').value.toLowerCase();
                document.getElementById('game-picker-list').innerHTML = myGames
                    .filter(g => (g.name || g.title || '').toLowerCase().includes(q))
                    .map(g => {
                        const name = g.name || g.title;
                        const thumb = (g.customFields && g.customFields['대표 이미지']) || g.image || '';
                        return `<div class="bottom-sheet-item" onclick="editGames.push({ gameId:'${g.id}', gameName:'${name.replace(/'/g, "")}', gameThumbnail:'${thumb}', rounds:[{}] }); renderEditForm(); document.getElementById('game-picker-overlay').classList.remove('open');">
                            <img src="${thumb}" onerror="this.style.display='none'">
                            <span>${name}</span>
                        </div>`;
                    }).join('');
            };

            document.getElementById('add-game-result-btn').onclick = () => {
                document.getElementById('game-picker-search').value = '';
                renderPicker();
                document.getElementById('game-picker-overlay').classList.add('open');
            };
            document.getElementById('game-picker-search').oninput = renderPicker;
            document.getElementById('game-picker-overlay').onclick = (e) => {
                if (e.target.id === 'game-picker-overlay') e.target.classList.remove('open');
            };

            document.getElementById('save-session-btn').onclick = () => {
                if (editGames.length === 0) { alert('게임을 1개 이상 선택해주세요.'); return; }
                const newRec = {
                    id: `s_${Date.now()}`,
                    date: document.getElementById('session-date').value,
                    players: [...editPlayers],
                    games: [...editGames],
                    rating: parseInt(document.getElementById('session-rating').value, 10) || 5,
                    memo: document.getElementById('session-memo').value.trim()
                };
                allSessions.unshift(newRec);
                localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(allSessions));

                // 책장 게임 플레이 횟수 +1 연동
                editGames.forEach(eg => {
                    const target = myGames.find(mg => mg.id === eg.gameId || (mg.name || mg.title) === eg.gameName);
                    if (target) target.plays = (Number(target.plays) || 0) + 1;
                });
                localStorage.setItem(GAMES_STORAGE_KEY, JSON.stringify(myGames));

                closeEdit();
                renderSessions();
            };
        });
    </script>
</body>
</html>
