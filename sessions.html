<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>게임 기록 - 나의 보드게임 책장</title>
    <link rel="stylesheet" href="style.css?v=19">
    <style>
        .sessions-fullscreen-layout { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--bg-main); }
        .sessions-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .sessions-header h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .sessions-body { flex: 1; overflow-y: auto; padding: 1rem; max-width: 36rem; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        /* 직관적인 전적 카드 스타일 [L-1] */
        .session-card-compact { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; margin-bottom: 0.875rem; box-shadow: 0 1px 4px var(--shadow-color); cursor: pointer; }
        .sc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.82rem; color: var(--text-secondary); }
        .sc-body { display: flex; gap: 0.75rem; align-items: center; }
        .sc-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--bg-secondary); flex-shrink: 0; }
        .sc-info { flex: 1; min-width: 0; }
        .sc-gname { font-weight: 700; font-size: 0.98rem; margin-bottom: 0.2rem; }
        .sc-result { font-size: 0.84rem; color: var(--text-primary); }

        /* [E-1] 원터치 참여자 칩 바 스타일 */
        .chip-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
        .member-chip { padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-secondary); font-size: 0.82rem; font-weight: 600; cursor: pointer; }
        .member-chip.active { background: var(--md-primary); color: var(--md-on-primary); border-color: var(--md-primary); }

        /* [E-3] 협동/솔로 결과 토글 버튼 */
        .coop-toggle-group { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .coop-btn { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); font-weight: 700; cursor: pointer; font-size: 0.9rem; }
        .coop-btn.win.active { background: #dcfce7; color: #166534; border-color: #22c55e; }
        .coop-btn.lose.active { background: #fee2e2; color: #991b1b; border-color: #ef4444; }

        .edit-section { background: var(--bg-card); border-radius: 12px; padding: 1rem; border: 1px solid var(--border-color); margin-bottom: 1rem; }
        .edit-section-title { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.75rem; text-transform: uppercase; }
        .small-btn { padding: 0.45rem 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; font-size: 0.82rem; font-weight: 600; }
        .small-btn.primary { background: var(--md-primary); color: #fff; border-color: var(--md-primary); }
    </style>
</head>
<body>
    <div class="sessions-fullscreen-layout">
        <header class="sessions-header">
            <a href="./" class="action-icon-btn" title="책장으로 돌아가기">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h1>게임 기록 및 전적</h1>
            <button id="add-session-btn" class="action-icon-btn" title="새 기록 추가">＋</button>
        </header>

        <div class="sessions-body" id="sessions-body">
            <!-- [L-2] 검색 및 미니 캘린더 필터 바 -->
            <div style="margin-bottom:1rem; display:flex; gap:0.5rem;">
                <input type="text" id="session-search-input" class="filter-input" placeholder="게임명 또는 참여자 검색...">
            </div>

            <div id="sessions-list-view">
                <div id="sessions-list-container"></div>
            </div>

            <!-- 직관적 작성 화면 -->
            <div id="sessions-edit-view" style="display:none;">
                <div class="edit-section">
                    <div class="edit-section-title">날짜</div>
                    <input type="date" id="session-date" class="filter-input">
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">참여자 ([E-1] 원터치 선택)</div>
                    <div id="quick-member-chips" class="chip-bar"></div>
                    <div style="display:flex; gap:0.5rem; margin-top:0.6rem;">
                        <input type="text" id="new-player-input" class="filter-input" placeholder="새 멤버 이름 입력 후 추가">
                        <button class="small-btn" id="add-player-btn" type="button">추가</button>
                    </div>
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">플레이한 게임</div>
                    <div id="edit-games-container" style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:0.75rem;"></div>
                    <button class="small-btn primary" id="pick-game-btn" type="button" style="width:100%; padding:0.65rem;">+ 내 책장에서 게임 고르기</button>
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">만족도 별점 &amp; 메모</div>
                    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.75rem;">
                        <span>만족도:</span>
                        <div id="star-row" style="font-size:1.4rem; cursor:pointer; color:#f59e0b;">★★★★★</div>
                    </div>
                    <textarea id="session-memo" class="memo-box" placeholder="오늘의 소감이나 특이사항을 적어보세요..." rows="3"></textarea>
                </div>

                <div style="display:flex; gap:0.5rem; margin-bottom:2rem;">
                    <button class="small-btn" id="cancel-edit-btn" style="flex:1; padding:0.75rem;">취소</button>
                    <button class="small-btn primary" id="save-session-btn" style="flex:1; padding:0.75rem;">기록 저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 게임 선택 바텀시트 -->
    <div class="bottom-sheet-overlay" id="game-picker-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200;">
        <div class="bottom-sheet" style="position:fixed; bottom:0; left:0; right:0; background:var(--bg-card); border-radius:16px 16px 0 0; padding:1.25rem; max-height:70vh; display:flex; flex-direction:column;">
            <h3>내 책장 게임 선택</h3>
            <input type="text" id="game-picker-search" class="filter-input" placeholder="게임 이름 검색..." style="margin:0.5rem 0;">
            <div id="game-picker-list" style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:0.5rem;"></div>
        </div>
    </div>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
        <a href="./" class="nav-item" aria-label="책장">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            <span>책장</span>
        </a>
        <a href="./sessions.html" class="nav-item active" aria-label="게임 기록">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>게임 기록</span>
        </a>
        <a href="./mypage.html" class="nav-item" aria-label="마이페이지">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>마이페이지</span>
        </a>
    </nav>

    <script>
        const GAMES_STORAGE_KEY = "MY_BG_SHELF_DATA_V1";
        const SESSIONS_STORAGE_KEY = "MY_BG_SESSIONS_V1";
        const PLAYERS_STORAGE_KEY = "MY_BG_PLAYERS_V1";
        const GIST_CONFIG_KEY = "MY_BG_GIST_CONFIG_V1";
        const GIST_FILENAME = "myboardgames_db.json";

        let allSessions = [];
        let allPlayers = ['나', '배우자', '아이', '모임원'];
        let myGames = [];
        let editState = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

            allSessions = JSON.parse(localStorage.getItem(SESSIONS_STORAGE_KEY) || '[]');
            allPlayers = JSON.parse(localStorage.getItem(PLAYERS_STORAGE_KEY) || '["나", "배우자", "아이", "모임원"]');
            myGames = JSON.parse(localStorage.getItem(GAMES_STORAGE_KEY) || '[]');

            renderSessionList();

            // [E-4] 책장에서 '오늘 플레이 기록' 버튼을 눌러 넘어온 경우 자동 처리
            try {
                const qp = new URLSearchParams(window.location.search);
                if (qp.get('sessionAddGame') === '1' || localStorage.getItem('bgs_quick_add_game')) {
                    const gid = qp.get('gameId') || localStorage.getItem('bgs_quick_add_game');
                    localStorage.removeItem('bgs_quick_add_game');
                    const targetGame = myGames.find(g => g.id === gid);
                    openEdit(null);
                    if (targetGame) {
                        editState.games.push({
                            gameId: targetGame.id,
                            gameName: targetGame.name || targetGame.title,
                            gameThumbnail: targetGame.image || targetGame.thumbnail || '',
                            mode: 'compete', // compete | coop | none
                            coopResult: 'win',
                            rounds: [{ scores: {}, winner: '' }]
                        });
                        renderEditGames();
                    }
                    const cleanUrl = new URL(window.location);
                    cleanUrl.searchParams.delete('sessionAddGame');
                    cleanUrl.searchParams.delete('gameId');
                    history.replaceState({}, '', cleanUrl);
                }
            } catch (_) {}

            $('#add-session-btn').onclick = () => openEdit(null);
            $('#cancel-edit-btn').onclick = closeEdit;
            $('#save-session-btn').onclick = saveSession;
            $('#add-player-btn').onclick = () => {
                const val = $('#new-player-input').value.trim();
                if (!val) return;
                if (!allPlayers.includes(val)) {
                    allPlayers.push(val);
                    localStorage.setItem(PLAYERS_STORAGE_KEY, JSON.stringify(allPlayers));
                }
                if (editState && !editState.players.includes(val)) editState.players.push(val);
                $('#new-player-input').value = '';
                renderMemberChips();
            };
            $('#pick-game-btn').onclick = () => {
                renderGamePickerList('');
                $('#game-picker-overlay').style.display = 'block';
            };
            $('#game-picker-overlay').onclick = (e) => { if (e.target.id === 'game-picker-overlay') e.target.style.display = 'none'; };
            $('#game-picker-search').oninput = (e) => renderGamePickerList(e.target.value);
            $('#session-search-input').oninput = (e) => renderSessionList(e.target.value);
        });

        function renderSessionList(searchFilter = '') {
            const container = $('#sessions-list-container');
            const q = searchFilter.trim().toLowerCase();

            const filtered = allSessions.filter(s => {
                if (!q) return true;
                const matchMemo = (s.memo || '').toLowerCase().includes(q);
                const matchPlayer = (s.players || []).some(p => p.toLowerCase().includes(q));
                const matchGame = (s.games || []).some(g => (g.gameName || '').toLowerCase().includes(q));
                return matchMemo || matchPlayer || matchGame;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-secondary);">해당하는 게임 기록이 없습니다.</div>';
                return;
            }

            container.innerHTML = filtered.map(s => {
                const firstG = (s.games || [])[0] || {};
                const thumb = firstG.gameThumbnail || 'https://placehold.co/60x60/6750A4/ffffff?text=BG';
                const gNames = (s.games || []).map(g => g.gameName).join(', ');
                
                // 직관적 결과 요약 [L-1]
                let resultSummary = '';
                if (firstG.mode === 'coop') {
                    resultSummary = firstG.coopResult === 'win' ? '🎉 협동전 승리 (클리어)' : '💀 협동전 패배 (실패)';
                } else if (firstG.rounds && firstG.rounds.length > 0) {
                    const r1 = firstG.rounds[0];
                    if (r1.winner) resultSummary = `🥇 우승자: <strong>${r1.winner}</strong>`;
                    else if (r1.scores && Object.keys(r1.scores).length > 0) {
                        const topP = Object.entries(r1.scores).sort((a,b)=>b[1]-a[1])[0];
                        if (topP) resultSummary = `🥇 ${topP[0]} (${topP[1]}점)`;
                    }
                }

                return `
                    <div class="session-card-compact" onclick="openEdit('${s.id}')">
                        <div class="sc-top">
                            <span>📅 ${s.date}</span>
                            <button type="button" class="small-btn" style="color:var(--error-color); padding:0.1rem 0.4rem;" onclick="event.stopPropagation(); deleteSession('${s.id}')">삭제</button>
                        </div>
                        <div class="sc-body">
                            <img src="${thumb}" class="sc-thumb" referrerpolicy="no-referrer" onerror="this.src='https://placehold.co/60x60/6750A4/ffffff?text=BG'">
                            <div class="sc-info">
                                <div class="sc-gname">${escapeHtmlSafe(gNames)}</div>
                                <div class="sc-result">${resultSummary || (s.players ? '참여자: ' + s.players.join(', ') : '')}</div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function openEdit(sessionId) {
            const todayStr = new Date().toISOString().slice(0, 10);
            if (sessionId) {
                const found = allSessions.find(s => s.id === sessionId);
                if (found) {
                    editState = JSON.parse(JSON.stringify(found));
                }
            } else {
                editState = {
                    id: `s_${Date.now()}`,
                    date: todayStr,
                    players: ['나'],
                    games: [],
                    rating: 5,
                    memo: ''
                };
            }

            $('#sessions-list-view').style.display = 'none';
            $('#session-search-input').style.display = 'none';
            $('#sessions-edit-view').style.display = 'flex';
            $('#add-session-btn').style.display = 'none';

            $('#session-date').value = editState.date;
            $('#session-memo').value = editState.memo;
            renderMemberChips();
            renderEditGames();
        }

        function closeEdit() {
            $('#sessions-edit-view').style.display = 'none';
            $('#sessions-list-view').style.display = '';
            $('#session-search-input').style.display = '';
            $('#add-session-btn').style.display = '';
            editState = null;
            renderSessionList();
        }

        function renderMemberChips() {
            const box = $('#quick-member-chips');
            box.innerHTML = allPlayers.map(p => {
                const isSel = editState.players.includes(p);
                return `<button type="button" class="member-chip ${isSel ? 'active' : ''}" onclick="togglePlayer('${p}')">👤 ${p}</button>`;
            }).join('');
        }

        function togglePlayer(name) {
            if (editState.players.includes(name)) {
                if (editState.players.length === 1) { showMessage('최소 1명은 참여해야 합니다.', 'error'); return; }
                editState.players = editState.players.filter(p => p !== name);
            } else {
                editState.players.push(name);
            }
            renderMemberChips();
        }

        function renderEditGames() {
            const box = $('#edit-games-container');
            if (editState.games.length === 0) {
                box.innerHTML = '<p style="text-align:center; color:var(--text-secondary); font-size:0.85rem;">선택된 게임이 없습니다. 아래 버튼을 눌러 추가하세요.</p>';
                return;
            }

            box.innerHTML = editState.games.map((g, gIdx) => {
                const mode = g.mode || 'compete';
                let bodyHtml = '';

                if (mode === 'coop') {
                    bodyHtml = `
                        <div class="coop-toggle-group">
                            <button type="button" class="coop-btn win ${g.coopResult === 'win' ? 'active' : ''}" onclick="setCoopResult(${gIdx}, 'win')">🎉 클리어 (승리)</button>
                            <button type="button" class="coop-btn lose ${g.coopResult === 'lose' ? 'active' : ''}" onclick="setCoopResult(${gIdx}, 'lose')">💀 실패 (패배)</button>
                        </div>`;
                } else if (mode === 'compete') {
                    const rounds = g.rounds || [{ scores: {}, winner: '' }];
                    bodyHtml = rounds.map((r, rIdx) => `
                        <div style="background:var(--bg-main); border:1px solid var(--border-color); border-radius:8px; padding:0.6rem; margin-bottom:0.5rem;">
                            <div style="display:flex; justify-content:space-between; font-size:0.78rem; font-weight:700; color:var(--text-secondary); margin-bottom:0.4rem;">
                                <span>${rIdx + 1}판 점수 및 우승자</span>
                                <button type="button" class="small-btn" style="color:var(--error-color); padding:0.1rem 0.3rem;" onclick="removeRound(${gIdx}, ${rIdx})">판 삭제</button>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:0.35rem;">
                                ${editState.players.map(p => `
                                    <div style="display:flex; align-items:center; gap:0.5rem;">
                                        <span style="font-size:0.85rem; min-width:70px; font-weight:600;">${p}</span>
                                        <input type="number" class="filter-input" style="padding:0.3rem; height:2rem;" placeholder="점수" value="${r.scores[p] !== undefined ? r.scores[p] : ''}" oninput="setScore(${gIdx}, ${rIdx}, '${p}', this.value)">
                                    </div>`).join('')}
                            </div>
                            <input type="text" class="filter-input" style="margin-top:0.4rem; padding:0.3rem; height:2rem; font-size:0.82rem;" placeholder="우승자 (예: 승휘) 또는 판 메모" value="${escapeHtmlSafe(r.winner || '')}" oninput="setWinner(${gIdx}, ${rIdx}, this.value)">
                        </div>`).join('') + `
                        <button type="button" class="small-btn" style="width:100%;" onclick="addRound(${gIdx})">+ 판 추가</button>`;
                }

                return `
                    <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:10px; padding:0.875rem;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
                            <strong>${escapeHtmlSafe(g.gameName)}</strong>
                            <button type="button" class="small-btn" style="color:var(--error-color);" onclick="removeEditGame(${gIdx})">게임 제거</button>
                        </div>
                        <div style="display:flex; gap:0.4rem; margin-bottom:0.6rem;">
                            <button type="button" class="small-btn ${mode === 'compete' ? 'primary' : ''}" onclick="setGameMode(${gIdx}, 'compete')">🏆 경쟁(점수)</button>
                            <button type="button" class="small-btn ${mode === 'coop' ? 'primary' : ''}" onclick="setGameMode(${gIdx}, 'coop')">🤝 협동·솔로</button>
                            <button type="button" class="small-btn ${mode === 'none' ? 'primary' : ''}" onclick="setGameMode(${gIdx}, 'none')">🎲 승패없음</button>
                        </div>
                        ${bodyHtml}
                    </div>`;
            }).join('');
        }

        function setGameMode(gIdx, mode) {
            editState.games[gIdx].mode = mode;
            if (mode === 'compete' && !editState.games[gIdx].rounds) {
                editState.games[gIdx].rounds = [{ scores: {}, winner: '' }];
            }
            renderEditGames();
        }
        function setCoopResult(gIdx, res) { editState.games[gIdx].coopResult = res; renderEditGames(); }
        function addRound(gIdx) { editState.games[gIdx].rounds.push({ scores: {}, winner: '' }); renderEditGames(); }
        function removeRound(gIdx, rIdx) { editState.games[gIdx].rounds.splice(rIdx, 1); renderEditGames(); }
        function removeEditGame(gIdx) { editState.games[gIdx].splice(gIdx, 1); renderEditGames(); }
        function setScore(gIdx, rIdx, player, val) {
            const n = parseFloat(val);
            if (val === '' || isNaN(n)) delete editState.games[gIdx].rounds[rIdx].scores[player];
            else editState.games[gIdx].rounds[rIdx].scores[player] = n;
        }
        function setWinner(gIdx, rIdx, val) { editState.games[gIdx].rounds[rIdx].winner = val; }

        function renderGamePickerList(filterQ) {
            const q = (filterQ || '').trim().toLowerCase();
            const list = myGames.filter(g => (g.name || g.title || '').toLowerCase().includes(q));
            const box = $('#game-picker-list');
            box.innerHTML = list.map(g => {
                const name = g.name || g.title;
                const thumb = resolveCoverUrl(g.customFields?.['대표 이미지'] || g.image || g.thumbnail);
                return `
                    <div class="bottom-sheet-item" onclick="selectGameForEdit('${g.id}', '${name.replace(/'/g, "\\'")}', '${thumb}')">
                        <img src="${thumb}" style="width:40px; height:40px; object-fit:cover; border-radius:6px;" referrerpolicy="no-referrer" onerror="this.style.display='none'">
                        <span>${escapeHtmlSafe(name)}</span>
                    </div>`;
            }).join('') || '<p style="padding:1rem; color:var(--text-secondary);">검색 결과가 없습니다.</p>';
        }

        function selectGameForEdit(id, name, thumb) {
            if (!editState.games.some(g => g.gameId === id)) {
                editState.games.push({
                    gameId: id,
                    gameName: name,
                    gameThumbnail: thumb,
                    mode: 'compete',
                    rounds: [{ scores: {}, winner: '' }]
                });
                renderEditGames();
            }
            $('#game-picker-overlay').style.display = 'none';
        }

        function saveSession() {
            if (!editState) return;
            if (editState.games.length === 0) { alert('게임을 1개 이상 추가해주세요.'); return; }
            editState.date = $('#session-date').value;
            editState.memo = $('#session-memo').value.trim();

            const idx = allSessions.findIndex(s => s.id === editState.id);
            if (idx >= 0) allSessions[idx] = editState;
            else allSessions.unshift(editState);

            localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(allSessions));

            // 책장 게임 플레이 횟수 연동
            const rawGames = JSON.parse(localStorage.getItem(GAMES_STORAGE_KEY) || '[]');
            editState.games.forEach(eg => {
                const target = rawGames.find(mg => mg.id === eg.gameId || (mg.name || mg.title) === eg.gameName);
                if (target) target.plays = (Number(target.plays) || 0) + 1;
            });
            localStorage.setItem(GAMES_STORAGE_KEY, JSON.stringify(rawGames));

            closeEdit();
            renderSessionList();
            showMessage('게임 기록이 저장되었습니다!', 'success');
        }

        function deleteSession(id) {
            allSessions = allSessions.filter(s => s.id !== id);
            localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(allSessions));
            renderSessionList();
            showMessage('기록이 삭제되었습니다.', 'success');
        }

        function resolveCoverUrl(raw) {
            if (!raw) return '';
            const s = String(raw).trim();
            const m = s.match(/^(?:bl_)?(\d{1,6})$/i);
            if (m) return `${STORAGE_BL_BASE}/bl_${m[1]}.webp`;
            return s;
        }

        function escapeHtmlSafe(str) {
            if (str == null) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function showMessage(msg, type = 'success') {
            const box = $('.message-container');
            if (!box) return;
            const el = document.createElement('div');
            el.className = `message ${type}`;
            el.textContent = msg;
            box.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    </script>
</body>
</html>
